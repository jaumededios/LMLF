targets:
  - target_id: DEF-001-T01
    module: LMLF.Definitions.Gamma
    declaration: LMLF.Definitions.gamma_eulerIntegrable
    theorem_class: qualitative_support
    coverage_class: source_prerequisite
    novelty_class: equivalent_reformulation
    relationship_to_source: >-
      Readable wrapper around Complex.GammaIntegral_convergent with the Euler
      integrand expanded; no new convergence theorem.
    theorem_card_id: TC-DEF-001-R1
    natural_language_proof_id: not_applicable
    exact_lean_signature: |
      theorem gamma_eulerIntegrable {s : ℂ} (hs : 0 < s.re) :
          MeasureTheory.IntegrableOn
            (fun t : ℝ => (Real.exp (-t) : ℂ) * (t : ℂ) ^ (s - 1))
            (Set.Ioi 0)
    mathematical_statement: The Euler Gamma integrand is integrable on (0,infinity) when re(s)>0.
    order_convention: not_applicable
    domain: Complex s with 0 < s.re; integration variable t lies in Set.Ioi 0.
    nonempty_witness: s = 1 satisfies the parameter domain.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: >-
      Positive real t uses mathlib complex power; t>0 avoids zero and the
      standard slit-plane cut.
    exceptional_values: The statement is not made outside 0 < s.re.
    normalization: Euler integrand exp(-t) * t^(s-1), with no scale factor.
  - target_id: DEF-001-T02
    module: LMLF.Definitions.Gamma
    declaration: LMLF.Definitions.gamma_eq_eulerIntegral
    theorem_class: identification
    coverage_class: source_prerequisite
    novelty_class: equivalent_reformulation
    relationship_to_source: >-
      Readable wrapper around Complex.Gamma_eq_integral and Complex.GammaIntegral.
    theorem_card_id: TC-DEF-001-R1
    natural_language_proof_id: not_applicable
    exact_lean_signature: |
      theorem gamma_eq_eulerIntegral {s : ℂ} (hs : 0 < s.re) :
          Complex.Gamma s =
            ∫ t in Set.Ioi (0 : ℝ),
              (Real.exp (-t) : ℂ) * (t : ℂ) ^ (s - 1)
    mathematical_statement: Gamma(s) equals Euler's integral when re(s)>0.
    order_convention: not_applicable
    domain: Complex s with 0 < s.re; integration variable t lies in Set.Ioi 0.
    nonempty_witness: s = 1 satisfies the parameter domain.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: >-
      Positive real t uses mathlib complex power; t>0 avoids zero and the
      standard slit-plane cut.
    exceptional_values: The equality is not asserted through poles or outside its convergence domain.
    normalization: Complex.Gamma 1 = 1, consistent with the displayed integral.
  - target_id: DEF-001-T03
    module: LMLF.Definitions.Gamma
    declaration: LMLF.Definitions.gamma_ofReal
    theorem_class: identification
    coverage_class: source_prerequisite
    novelty_class: source_equivalent
    relationship_to_source: Exact wrapper around Complex.Gamma_ofReal.
    theorem_card_id: TC-DEF-001-R1
    natural_language_proof_id: not_applicable
    exact_lean_signature: |
      theorem gamma_ofReal (s : ℝ) :
          Complex.Gamma (s : ℂ) = (Real.Gamma s : ℂ)
    mathematical_statement: Complex Gamma restricted to real inputs agrees with Real.Gamma.
    order_convention: not_applicable
    domain: Every real s, including mathlib's totalized exceptional inputs.
    nonempty_witness: s = 1.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: Agreement includes the same mathlib totalization at real poles.
    normalization: Both sides use mathlib's Gamma normalization.
  - target_id: DEF-001-T04
    module: LMLF.Definitions.Gamma
    declaration: LMLF.Definitions.gamma_neg_nat_eq_zero
    theorem_class: exact_identity
    coverage_class: source_prerequisite
    novelty_class: source_equivalent
    relationship_to_source: Exact wrapper around Complex.Gamma_neg_nat_eq_zero.
    theorem_card_id: TC-DEF-001-R1
    natural_language_proof_id: not_applicable
    exact_lean_signature: |
      theorem gamma_neg_nat_eq_zero (n : ℕ) :
          Complex.Gamma (-(n : ℂ)) = 0
    mathematical_statement: Mathlib's total Complex.Gamma is zero at negative natural inputs.
    order_convention: not_applicable
    domain: Every natural n.
    nonempty_witness: n = 0.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: These inputs are classical poles; zero is a totalization convention.
    normalization: Documents mathlib's totalization and does not assign a classical finite value.

