regressions:
  - declaration: LMLFTest.QB001.emptyDomain
    protects: generic empty-domain semantics
    expected_statement: ErrorOn empty f a b holds without extra hypotheses.
  - declaration: LMLFTest.QB001.exactZero
    protects: exactness and zero majorant
    expected_statement: Set.EqOn f a D implies ErrorOn D f a (fun _ => 0).
  - declaration: LMLFTest.QB001.transSum
    protects: additive majorant orientation
    expected_statement: The transitive bound is exactly fun x => b x + d x.

