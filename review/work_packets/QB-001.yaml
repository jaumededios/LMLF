      routine and non-novel, with no external source coverage.
    theorem_card_id: TC-QB-001-R3
    natural_language_proof_id: NLP-QB-001-R3
    exact_lean_signature: |
      def HasErrorFamily {X E : Type*} [NormedAddCommGroup E]
          (f : X → E) (a : ℕ → X → E)
          (D : ℕ → Set X) (b : ℕ → X → ℝ) : Prop
    mathematical_statement: |
      For every n, ErrorOn (D n) f (a n) (b n); f is fixed and no convergence
      in n is asserted.
    order_convention: n indexes only the supplied approximant, domain, and majorant.
    domain: "Arbitrary family D : ℕ → Set X."
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: b n x
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: not_applicable
    normalization: not_applicable
  - target_id: QB-001-T04
    module: LMLF.Quantitative.Basic
    declaration: QuantitativeAnalysis.ErrorOn.exact
    theorem_class: generic_quantitative
    coverage_class: reusable_infrastructure
    novelty_class: source_equivalent
    relationship_to_source: >-
      Exact formalization of the reviewed routine consequence of equality and
      norm_zero; no new mathematical claim.
    theorem_card_id: TC-QB-001-R3
    natural_language_proof_id: NLP-QB-001-R3
    exact_lean_signature: |
      theorem ErrorOn.exact {X E : Type*} [NormedAddCommGroup E]
          {D : Set X} {f a : X → E} (h : Set.EqOn f a D) :
          ErrorOn D f a (fun _ => 0)
    mathematical_statement: Equal functions on D have zero error on D.
    order_convention: not_applicable
    domain: Arbitrary set D with the explicit Set.EqOn hypothesis.
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: zero
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: not_applicable
    normalization: not_applicable
  - target_id: QB-001-T05
    module: LMLF.Quantitative.Basic
    declaration: QuantitativeAnalysis.ErrorOn.restrict
