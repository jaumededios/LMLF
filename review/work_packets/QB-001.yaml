    exact_lean_signature: |
      def ErrorOn {X E : Type*} [NormedAddCommGroup E]
          (D : Set X) (f a : X → E) (b : X → ℝ) : Prop
    mathematical_statement: |
      ErrorOn D f a b means forall x in D, norm (f x - a x) <= b x.
    order_convention: not_applicable
    domain: "Arbitrary set D : Set X; empty domains are allowed for infrastructure."
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: b x
