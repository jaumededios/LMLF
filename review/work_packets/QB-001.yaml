    theorem_card_id: TC-QB-001-R5
    natural_language_proof_id: NLP-QB-001-R4
    exact_lean_signature: |
      theorem ErrorOn.weaken {X E : Type*} [NormedAddCommGroup E]
          {D : Set X} {f a : X → E} {b d : X → ℝ}
          (h : ErrorOn D f a b) (hbd : ∀ x ∈ D, b x ≤ d x) : ErrorOn D f a d
    mathematical_statement: A valid error bound remains valid with a larger majorant.
    order_convention: not_applicable
    domain: The pointwise comparison b <= d is required exactly on D.
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: d x
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: not_applicable
    normalization: not_applicable
  - target_id: QB-001-T07
    module: LMLF.Quantitative.Basic
    declaration: QuantitativeAnalysis.ErrorOn.trans
    theorem_class: generic_quantitative
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Exact formalization of the reviewed routine triangle-inequality
      composition; no new mathematical claim.
    theorem_card_id: TC-QB-001-R5
    natural_language_proof_id: NLP-QB-001-R4
    exact_lean_signature: |
      theorem ErrorOn.trans {X E : Type*} [NormedAddCommGroup E]
          {D : Set X} {f a c : X → E} {b d : X → ℝ}
          (hfa : ErrorOn D f a b) (hac : ErrorOn D a c d) :
          ErrorOn D f c (fun x => b x + d x)
    mathematical_statement: Successive error bounds compose with majorant b+d.
    order_convention: not_applicable
    domain: Both premise bounds hold on the same arbitrary set D.
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: b x + d x
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: not_applicable
    normalization: not_applicable
  - target_id: QB-001-T08
    module: LMLF.Quantitative.Basic
    declaration: QuantitativeAnalysis.ErrorOn.comp
    theorem_class: generic_quantitative
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Exact formalization of the reviewed routine precomposition transport; no
      new mathematical claim.
    theorem_card_id: TC-QB-001-R5
    natural_language_proof_id: NLP-QB-001-R4
    exact_lean_signature: |
      theorem ErrorOn.comp {X Y E : Type*} [NormedAddCommGroup E]
          {D : Set X} {f a : X → E} {b : X → ℝ}
          (h : ErrorOn D f a b) {S : Set Y} (ψ : Y → X)
          (hψ : Set.MapsTo ψ S D) :
          ErrorOn S (f ∘ ψ) (a ∘ ψ) (b ∘ ψ)
    mathematical_statement: An error bound pulls back along a map from S into D.
    order_convention: not_applicable
    domain: Arbitrary S with explicit Set.MapsTo ψ S D.
    nonempty_witness: not_applicable_for_reusable_infrastructure
    bound: b (ψ y)
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: not_applicable
    normalization: not_applicable

