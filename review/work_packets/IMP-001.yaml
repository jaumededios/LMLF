regression_policy:
  acceptance_requirement: >-
    Every IMP-R01 through IMP-R25 and every theorem-card edge obligation is
    mandatory before implementation acceptance. Partial signature-harness
    evidence never converts an obligation to complete.
  target_proof_authorization: >-
    A passing external final pre-Lean gate authorizes implementation only of
    the exact eight targets and their private proof support.
  later_mathematical_regression_authorization: >-
    Before formalizing new analytic examples or counterexamples beyond the
    reviewed target derivations, bind a complete companion natural-language
    proof provisionally labeled NLP-IMP-001-REG and obtain at least two fresh
    independent reviews. This label is a plan, not a current path, digest,
    dependency, or authorization.
  change_control: >-
    A regression discovery requiring a changed target type, definition
    semantics, or mathematical premise returns the packet to a new frozen
    specification and fresh applicable pre-Lean review.

regressions:
  - regression_id: IMP-R01
    protects: T01 binder order E, f, k, S, I and visible S subset Ioi k semantics
    expected_statement: The production declaration exactly matches frozen T01 and its bound definition body.
    stage: target_implementation_acceptance
    current_evidence: Signature and definition bytes are compiled in SIG-IMP-001-R6-P2; production is absent.
    status: required_pending
  - regression_id: IMP-R02
    protects: empty exceptional-set base semantics
    expected_statement: Empty S reduces to honest regular truncations and the direct right-endpoint atTop limit.
    stage: target_implementation_acceptance
    current_evidence: Definition design contains the empty-list clause; no production regression exists.
    status: required_pending
  - regression_id: IMP-R03
    protects: T08 complete component semantics
    expected_statement: T08 works in both directions for empty and multiple-point S with every independent endpoint and the exact telescope.
    stage: target_implementation_acceptance
    current_evidence: T08's existential type and simple forward extraction compile; the multipoint telescope has a natural-language proof but no Lean proof yet.
    status: required_pending
  - regression_id: IMP-R04
    protects: rejection of principal-value-only cancellation
    expected_statement: A cutoff one-over-distance singularity with symmetric PV fails the two independent one-sided limits.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language adversarial argument only; no Lean theorem exists.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R05
    protects: acceptance of genuinely conditional finite singularities
    expected_statement: A cutoff sin(1/(t-c))/(t-c) has both independent improper sides but is not absolutely locally Bochner integrable across c.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language adversarial argument only; no Lean theorem exists.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R06
    protects: conditional convergence at infinity without absolute strengthening
    expected_statement: A tail such as sin(t)/t satisfies T01 for empty S without yielding IntegrableOn on the whole ray.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language adversarial argument only; no Lean theorem exists.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R07
    protects: honest regular-piece integrability and resistance to totalization
    expected_statement: Missing IntervalIntegrable evidence cannot construct T01 even when a totalized intervalIntegral expression has a value.
    stage: target_implementation_acceptance
    current_evidence: No exact production regression exists.
    authorization_precondition: >-
      An abstract projection/type-shape test follows the reviewed target. Any
      chosen concrete nonintegrable example first requires the reviewed
      NLP-IMP-001-REG companion.
    status: required_pending
  - regression_id: IMP-R08
    protects: T03 literal union, exact finite linearity, and heterogeneous codomain
    expected_statement: >-
      Test empty and two-term families, negation, complex multiplication,
      Real-to-Complex, Complex-to-Real, and the amplitude-on-S plus smooth-on-empty case.
    stage: target_implementation_acceptance
    current_evidence: >-
      Partial only: generic cross-codomain/literal-union shape and selected
      subtraction/recombination consumers compile against temporary axioms;
      the enumerated named CLM instances are not all present.
    status: required_pending
  - regression_id: IMP-R09
    protects: T04 orientation and degenerate prefix
    expected_statement: Test a = k and a nonzero constant prepended segment with exact J + I orientation.
    stage: target_implementation_acceptance
    current_evidence: "Partial only: a generic split/extraction consumer compiles; a=k and constant-prefix cases are missing."
    status: required_pending
  - regression_id: IMP-R10
    protects: T05 field boundary and absence of a hidden flat bound
    expected_statement: T05 exposes only above-k, continuity, normalization, regular integrability, and increments; no L or atTop limit.
    stage: target_implementation_acceptance
    current_evidence: Exact definition body is compiled in the signature proposal; production audit is pending.
    status: required_pending
  - regression_id: IMP-R11
    protects: continuity across exceptional points
    expected_statement: A discontinuous componentwise primitive cannot telescope across an exceptional point.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language counterexample only.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R12
    protects: all-intermediate-point increment law
    expected_statement: Endpoint equality alone for g=0 and F(t)=t(1-t) does not prove the private Abel identity or populate T05 for T06.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language counterexample only.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R13
    protects: degenerate Abel algebra, h=0, and lack of a derivative premise on F
    expected_statement: >-
      The private identity handles a=b and h=0; public T06 handles h=0 under
      its exact two tail premises and a bounded eventually constant
      nondifferentiable indicator primitive for h>0.
    stage: target_and_later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Signature admits arbitrary h, but neither the algebraic cases nor indicator example is implemented.
    authorization_precondition: >-
      The a=b and h=0 algebra belong to the reviewed target proof. The
      nondifferentiable indicator example requires the reviewed
      NLP-IMP-001-REG companion.
    status: required_pending
  - regression_id: IMP-R14
    protects: split-improper exceptional prefix semantics
    expected_statement: Exceptional finite prefixes are sums of component values and are never collapsed to one intervalIntegral across a singularity.
    stage: target_implementation_acceptance
    current_evidence: T06 signature shape does not establish this private production proof property.
    status: required_pending
  - regression_id: IMP-R15
    protects: downward-only production import and axiom architecture
    expected_statement: No IMP module imports QL, OLV, Watson, source, Gamma, QB, or DEF; all eight public axiom reports satisfy the allowlist.
    stage: target_implementation_acceptance
    current_evidence: Proposal import surfaces pass only in the disposable harness; production is absent.
    status: required_pending
  - regression_id: IMP-R16
    protects: proof-before-Lean gate
    expected_statement: No production target proof begins before an external envelope records final lean_ready pass.
    stage: pre_implementation_gate_and_acceptance_audit
    current_evidence: Production is absent and no authorization is claimed.
    status: required_pending
  - regression_id: IMP-R17
    protects: T03 proof route without representation dependence
    expected_statement: T03 weakens each T05 witness to literal s.biUnion S, constructs the mapped finite-sum primitive, and invokes T08 reverse.
    stage: target_implementation_acceptance
    current_evidence: The signature consumer does not prove this production theorem route.
    status: required_pending
  - regression_id: IMP-R18
    protects: exact restricted-product Bochner Fubini premise and local measurability
    expected_statement: >-
      The private kernel proves Integrable (uncurry K) under exactly the product
      of the two volume.restrict (uIoc a b) measures and proves
      AEStronglyMeasurable only under that measure, with no global premise.
    stage: target_implementation_acceptance
    current_evidence: No production proof body exists; signatures do not discharge the Fubini premise.
    status: required_pending
  - regression_id: IMP-R19
    protects: exact exponential derivative dependency and no division by h
    expected_statement: Derive (exp(-h*t))'=-h*exp(-h*t) from Real.hasDerivAt_exp and prove the FTC identity also at h=0.
    stage: target_implementation_acceptance
    current_evidence: No production proof body exists; the pinned import/name was only checked during design.
    status: required_pending
  - regression_id: IMP-R20
    protects: arbitrary-S public QL-shaped reachability
    expected_statement: >-
      From public T05, h>0, L>=0, and the separate flat bound on Ici k, derive
      weighted IntegrableOn and boundary vanishing, then invoke only public T06
      on the same S without unfolding T01 or naming private helpers.
    stage: target_implementation_acceptance
    current_evidence: A complete consumer compiles against temporary target axioms; it must be rerun unchanged against actual target proofs.
    status: required_pending
  - regression_id: IMP-R21
    protects: honest arbitrary-S Bochner bridge
    expected_statement: T07 works for every finite S above k and its typed negative guard rejects omission of IntegrableOn.
    stage: target_implementation_acceptance
    current_evidence: Positive signature use and isolated negative-guard sensitivity are compiled; the actual T07 proof and final rerun are pending.
    status: required_pending
  - regression_id: IMP-R22
    protects: initial-endpoint semantics
    expected_statement: >-
      An exponentially cut off square-root singularity at k is accepted, while
      a conditionally improper non-L1 singularity at k is rejected.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: Natural-language examples only; no Lean theorem exists.
    authorization_precondition: reviewed NLP-IMP-001-REG companion
    status: required_pending
  - regression_id: IMP-R23
    protects: T08 existential quantifier, two directions, no quantitative bound in the signature, and below-k irrelevance
    expected_statement: >-
      T08 rejects a fixed arbitrary F, works in both directions, exposes no
      norm bound, and is invariant under changing witness values below k.
    stage: target_implementation_acceptance
    current_evidence: >-
      Partial only: the fixed-F guard is sensitivity-tested and forward
      extraction/no-bound are consumer-visible; full below-k invariance is not proved.
    status: required_pending
  - regression_id: IMP-R24
    protects: null-set endpoint values
    expected_statement: Changing f at k and at every c in S preserves T01, T07, and T08.
    stage: later_reviewed_mathematical_regression_then_acceptance
    current_evidence: "Partial only: the harness checks initial-point update for the T07 bridge, not full T01/T08 or every c in S."
    authorization_precondition: reviewed NLP-IMP-001-REG companion for the full invariance theorem
    status: required_pending
  - regression_id: IMP-R25
    protects: absence of a bound in T08 and exact downstream route
    expected_statement: >-
      A public source-shaped consumer takes an explicit baseline T01 witness,
      uses T08 forward, and derives a norm bound separately from continuity
      plus the finite atTop limit. It compiles without QL/OLV imports and
      exercises the route intended for their later implementations; actual
      QL/OLV implementation is not an IMP acceptance prerequisite.
    stage: target_implementation_acceptance
    current_evidence: "Partial only: a conditional one-model public-interface chain compiles; no OLV code or accepted downstream proof exists."
    status: required_pending

card_edge_obligations:
  mapping_in_card_order:
    - edge: empty exceptional set reduces to an ordinary right-endpoint limit
      regression_ids: [IMP-R02]
    - edge: T08 empty and multiple-point exact telescope
      regression_ids: [IMP-R03]
    - edge: amplitude on S plus smooth model terms on empty concludes on S
      regression_ids: [IMP-R08, IMP-R17]
    - edge: T03 cross-codomain scalar transports
      regression_ids: [IMP-R08]
    - edge: principal-value-only one-over-distance singularity is rejected
      regression_ids: [IMP-R04]
    - edge: conditionally convergent one-sided finite singularity is accepted
      regression_ids: [IMP-R05]
    - edge: sin(t)/t tail is not strengthened to absolute integrability
      regression_ids: [IMP-R06]
    - edge: nonintegrable truncation cannot pass through totalization
      regression_ids: [IMP-R07]
    - edge: square-root versus conditionally improper non-L1 initial singularities
      regression_ids: [IMP-R22]
    - edge: discontinuous componentwise primitive cannot telescope
      regression_ids: [IMP-R11]
    - edge: endpoint equality cannot replace every-point increments
      regression_ids: [IMP-R12]
    - edge: exceptional prefix is not one intervalIntegral
      regression_ids: [IMP-R14]
    - edge: exact restricted-product Integrable kernel
      regression_ids: [IMP-R18]
    - edge: measure-local AEStronglyMeasurable without global StronglyMeasurable
      regression_ids: [IMP-R18]
    - edge: Real.hasDerivAt_exp and no division by h
      regression_ids: [IMP-R19]
    - edge: private a=b and h=0 plus public h=0 and nondifferentiable primitive
      regression_ids: [IMP-R13]
    - edge: arbitrary-S QL-shaped public-only consumer
      regression_ids: [IMP-R20]
    - edge: arbitrary-S T07 and missing-IntegrableOn rejection
      regression_ids: [IMP-R21]
    - edge: existential T08 in both directions with no quantitative bound or bounding constant in the signature
      regression_ids: [IMP-R23]
    - edge: endpoint values and below-k witness values are irrelevant
      regression_ids: [IMP-R24, IMP-R23]
    - edge: T04 exact sign and value order
      regression_ids: [IMP-R09]
  status: all_required_before_implementation_acceptance

scope:
  included:
    - exactly eight public declarations in exactly the three frozen modules
    - T01 and T05 as the two exact bound definitions
    - T02, T03, T04, T06, T07, and T08 as the six theorem proofs
    - the exact canonical private sorted-component representation for T01
    - private proof support required for the eight targets, including the finite-piece Abel/Fubini identity
    - imports of the Abel and Bochner modules in the maintained LMLF/Results.lean umbrella, with no extra declarations or reverse imports
    - nonpublic regression files discharging IMP-R01 through IMP-R25 and every card edge obligation under the staged proof policy
    - local builds, import audits, public declaration axiom audits, and exact public-use regressions
  excluded:
    - every ninth public declaration, public private-helper wrapper, constructor, eliminator, anchor API, or improper-integral value function
    - the private finite-piece Abel identity as a public theorem target
    - QB, DEF, QL, OLV, Watson, Gamma, source, or audit imports in production IMP modules
    - any bound field or bounding constant in T05 or T08
    - bounded-primitive estimates, Gamma moments, Watson remainders, or source recovery
    - principal-value, whole-line, two-sided-infinity, contour, or oscillatory APIs
    - numerical evaluators, floating-point or interval certificates, tolerance policies, quadrature, optimizers, and solvers
    - any new constructivity requirement motivated only by possible future verified numerical consumers
  exact_identity_estimate_separation: >-
    All public values, hypotheses, and finite identities remain explicit. T01,
    T03, T04, T06, and T08 state exact relations or equivalences; no estimate
    or constant loss is hidden in them. Later estimates must be separate
    declarations under separate bounded specifications.

verification:
  status: future_acceptance_commands_not_current_implementation_evidence
  local_only: true
  github_ci_calls_permitted: false
  commands:
    - lake build
    - lake env lean LMLF/Integral/Improper/Basic.lean
    - lake env lean LMLF/Integral/Improper/Bochner.lean
    - lake env lean LMLF/Integral/Improper/Abel.lean
    - lake env lean LMLFTest/Integral/Improper/IMP001PublicUse.lean
    - lake env lean LMLFTest/Integral/Improper/IMP001Regressions.lean
    - python3 scripts/validate_inventory.py
    - python3 scripts/validate_inventory.py --negative-tests
  command_note: >-
    The production and LMLFTest files do not yet exist. These are required
    local acceptance commands after authorized implementation and staged
    regression proof work; listing them is not a claim that they currently run.
    The initial lake build reaches all three IMP modules through the two
    permitted Results imports and produces their oleans before direct Lean
    checks of importing modules and the nonpublic test files.
  public_declarations_requiring_axiom_report:
    - LMLF.Integral.HasImproperIntegralAtTopExcept
    - LMLF.Integral.HasImproperIntegralAtTopExcept.unique
    - LMLF.Integral.HasImproperIntegralAtTopExcept.finset_clm
    - LMLF.Integral.HasImproperIntegralAtTopExcept.split_regular
    - LMLF.Integral.IsFiniteExceptionalPrimitive
    - LMLF.Integral.IsFiniteExceptionalPrimitive.hasImproperIntegralAtTopExcept_exp_smul
    - LMLF.Integral.HasImproperIntegralAtTopExcept.of_integrableOn_Ioi
    - LMLF.Integral.hasImproperIntegralAtTopExcept_iff_exists_primitive
  allowed_axioms:
    - propext
    - Classical.choice
    - Quot.sound
  forbidden_production_declarations:
    - axiom
    - sorry
    - admit
  disposable_harness_disclosure: >-
    The signature proposal's six theorem axioms are excluded from production
    and cannot satisfy any target axiom audit or implementation review.

acceptance_notes: |
  This packet freezes a closed, source-free, one-card infrastructure scope. It
  binds TC-IMP-001-R7, frozen NLP-IMP-001-R7, its exact R6 mathematical-content
  provenance, and SIG-IMP-001-R6-P2. The prior reports are prerequisite
  historical context only and count zero toward the fresh final quorum.

  Card and packet freezing do not establish theorem-card review, proof review,
  structural review, lean_ready, implementation authorization, or acceptance.
  The final pre-Lean quorum requires three distinct reviewer IDs overall, two
  card reviewers, two natural-language-proof reviewers, and all three required
  structural perspectives. Authority lives only in an external envelope bound
  after the specification commit exists.

  Every IMP-R01 through IMP-R25 and every card edge obligation remains required
  before implementation acceptance. The signature harness provides only the
  partial evidence stated per row. A later hash-bound NLP-IMP-001-REG companion
  with at least two fresh independent reviews is required before formalizing
  the identified new analytic example/counterexample mathematics; the planned
  label is not a present dependency or authorization.

  Future verified numerical consumption is design motivation only. This packet
  creates no evaluator, certificate, numerical interface, or constructivity
  demand. Exact values and hypotheses remain explicit, and exact identities
  remain separate from any later estimate.
