assumptions:
  - name: complete_normed_real_spaces
    exact_content: >-
      E, and H for T03, have NormedAddCommGroup, NormedSpace Real, and
      CompleteSpace instances.
    provenance: explicit typeclass inputs
    why_not_hidden_goal: These are the natural Bochner integration and Hausdorff-limit structures.
  - name: finite_exceptions_above_start
    exact_content: Every c in each explicit finite exceptional set satisfies k < c.
    provenance: T01/T05 body or explicit theorem premise
    why_not_hidden_goal: This is domain bookkeeping and contains no convergence conclusion.
  - name: regular_piece_integrability
    exact_content: Every compact interval avoiding S has explicit IntervalIntegrable evidence.
    provenance: T01/T05 semantics and T04 explicit hf
    why_not_hidden_goal: It prevents Mathlib totalization from standing in for convergence.
  - name: independent_endpoint_limits
    exact_content: Each side of every c in S and the final atTop endpoint converges separately.
    provenance: Exact T01 definition semantics
    why_not_hidden_goal: This defines ordinary improper convergence and forbids principal-value cancellation.
  - name: normalized_continuous_increment_primitive
    exact_content: F is continuous on Ici k, F k = 0, and has the exact increment law on every S-regular interval.
    provenance: Exact T05 definition semantics
    why_not_hidden_goal: It contains no atTop convergence, bound, derivative, weighted value, or target relation.
  - name: weighted_tail_integrability
    exact_content: IntegrableOn (fun t => exp (-h*t) • F t) (Ioi k).
    provenance: Explicit T06 premise
    why_not_hidden_goal: It makes the totalized set integral in T06 honest; no flat bound is bundled.
  - name: weighted_boundary_vanishing
    exact_content: Tendsto (fun R => exp (-h*R) • F R) atTop (nhds 0).
    provenance: Explicit T06 premise
    why_not_hidden_goal: It removes only the terminal Abel boundary term.
  - name: whole_ray_absolute_integrability
    exact_content: IntegrableOn f (Ioi k).
    provenance: Explicit T07 premise
    why_not_hidden_goal: It makes T07's Bochner integral honest and is not inferred from T01.
  - name: existential_primitive
    exact_content: T08 quantifies exists F with T05 and Tendsto F atTop (nhds I).
    provenance: Exact T08 result type
    why_not_hidden_goal: It defines no selected primitive and includes no norm bound.

