targets:
  - target_id: IMP-001-T01
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.HasImproperIntegralAtTopExcept
    theorem_class: definition
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Source-independent classical ordinary-improper semantics with explicit
      finite-breakpoint bookkeeping; earns no source coverage.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t01
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      def LMLF.Integral.HasImproperIntegralAtTopExcept
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] (f : ℝ → E) (k : ℝ) (S : Finset ℝ)
          (I : E) : Prop
    mathematical_statement: >-
      S lies strictly above k; f is IntervalIntegrable on every compact
      regular truncation; all finite exceptional endpoints have independent
      one-sided limits; the final component has an atTop limit; and the exact
      finite component sum equals I.
    order_convention: S is canonically sorted increasingly only in private representation.
    domain: "Complete normed real E; f : Real -> E; k : Real; finite S subset Ioi k."
    nonempty_witness: S may be empty; the zero integrand relates to value zero.
    bound: not_applicable; no inequality or norm bound is part of T01.
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: Values at k and isolated points of S are null-set irrelevant; approach from each side is not.
    normalization: Proposed value I is explicit; no choice-selected value function exists.
  - target_id: IMP-001-T02
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.unique
    theorem_class: existence_uniqueness
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: Routine uniqueness of the component limits and their finite sum.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t02
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.HasImproperIntegralAtTopExcept.unique
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] {f : ℝ → E} {k : ℝ} {S : Finset ℝ}
          {I J : E}
          (hI : LMLF.Integral.HasImproperIntegralAtTopExcept f k S I)
          (hJ : LMLF.Integral.HasImproperIntegralAtTopExcept f k S J) :
          I = J
    mathematical_statement: Two relation witnesses for the same f, k, and S have equal explicit values.
    order_convention: Uses the same canonical increasing order of S in both witnesses.
    domain: The exact T01 domain for both hypotheses.
    nonempty_witness: The zero integrand at value zero supplies a consistent instance.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: No principal-value cancellation is introduced.
    normalization: No selected partial integral is defined.
  - target_id: IMP-001-T03
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.finset_clm
    theorem_class: exact_identity
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Classical finite linearity and continuous-linear transport from common
      input/value space E to an independently complete output space H.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t03
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.HasImproperIntegralAtTopExcept.finset_clm
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          {H : Type*} [NormedAddCommGroup H] [NormedSpace ℝ H]
          [CompleteSpace E] [CompleteSpace H]
          {A : Type*} (s : Finset A) (f : A → ℝ → E)
          (S : A → Finset ℝ) (I : A → E) (T : A → E →L[ℝ] H)
          {k : ℝ}
          (h : ∀ i ∈ s,
            LMLF.Integral.HasImproperIntegralAtTopExcept
              (f i) k (S i) (I i)) :
          LMLF.Integral.HasImproperIntegralAtTopExcept
            (fun t => ∑ i ∈ s, T i (f i t)) k
            (s.biUnion S) (∑ i ∈ s, T i (I i))
    mathematical_statement: >-
      A finite family of relations at the same k combines under maps E ->L[R]
      H on exactly the literal finite union s.biUnion S and exact mapped sum.
    order_convention: Finite index set s; no infinite sum or order limit.
    domain: Complete normed real E and H; arbitrary finite s and family data.
    nonempty_witness: The empty finite family gives the zero relation.
    bound: not_applicable; exact finite identity only.
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: Each supplied S i is retained through the literal union.
    normalization: Output value is exactly the finite mapped sum.
  - target_id: IMP-001-T04
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.split_regular
    theorem_class: exact_identity
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: Exact regular-prefix additivity and endpoint-limit transport.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t04
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.HasImproperIntegralAtTopExcept.split_regular
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] (f : ℝ → E) {a k : ℝ} (S : Finset ℝ)
          (I : E) (hak : a ≤ k) (hS : ∀ c ∈ S, k < c)
          (hf : IntervalIntegrable f MeasureTheory.volume a k) :
          LMLF.Integral.HasImproperIntegralAtTopExcept
              f a S ((∫ t in a..k, f t) + I) ↔
            LMLF.Integral.HasImproperIntegralAtTopExcept f k S I
    mathematical_statement: >-
      For a <= k and an honest regular prefix, the relation from a at the exact
      value integral_a^k f + I is equivalent to the relation from k at I.
    order_convention: Oriented interval a to k with explicit a <= k.
    domain: Same finite S above k and IntervalIntegrable f volume a k.
    nonempty_witness: a = k is the degenerate prefix case.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: No point of S lies in the prepended interval.
    normalization: Exact value orientation is J + I, never I + J by silent rewriting.
  - target_id: IMP-001-T05
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.IsFiniteExceptionalPrimitive
    theorem_class: definition
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: Source-independent normalized primitive certificate used by later consumers.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t05
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      def LMLF.Integral.IsFiniteExceptionalPrimitive
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] (g : ℝ → E) (k : ℝ) (S : Finset ℝ)
          (F : ℝ → E) : Prop
    mathematical_statement: >-
      S lies above k; F is continuous on Ici k; F k = 0; and every k <= a <= b
      whose Icc avoids S has honest g interval integrability and exact increment
      F b - F a = integral_a^b g.
    order_convention: Every oriented regular interval satisfies k <= a <= b.
    domain: Complete normed real E with explicit g, k, finite S, and F.
    nonempty_witness: g = 0 and F = 0 satisfy the predicate for every S above k.
    bound: not_applicable; no norm bound or atTop limit is a T05 field.
    derivative_convention: No derivative or absolute-continuity field is assumed.
    branch_convention: not_applicable
    exceptional_values: Continuity of F glues the independent endpoint values.
    normalization: F k = 0; values below k are unconstrained.
  - target_id: IMP-001-T06
    module: LMLF.Integral.Improper.Abel
    declaration: LMLF.Integral.IsFiniteExceptionalPrimitive.hasImproperIntegralAtTopExcept_exp_smul
    theorem_class: exact_identity
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Classical representation-independent finite-exception Abel composition,
      proved through a private finite-piece Fubini identity.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t06
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.IsFiniteExceptionalPrimitive.hasImproperIntegralAtTopExcept_exp_smul
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] {g F : ℝ → E} {k : ℝ} {S : Finset ℝ}
          (hF : LMLF.Integral.IsFiniteExceptionalPrimitive g k S F)
          (h : ℝ)
          (hInt : MeasureTheory.IntegrableOn
            (fun t => Real.exp (-h * t) • F t) (Set.Ioi k))
          (hLim : Filter.Tendsto
            (fun R => Real.exp (-h * R) • F R)
            Filter.atTop (nhds 0)) :
          LMLF.Integral.HasImproperIntegralAtTopExcept
            (fun t => Real.exp (-h * t) • g t) k S
            (h • ∫ t in Set.Ioi k, Real.exp (-h * t) • F t)
    mathematical_statement: >-
      From T05 and the two explicit weighted-tail hypotheses, for arbitrary
      real h conclude the weighted-g relation on the same literal S at exactly
      h scalar-multiplied by the Ioi integral of the weighted primitive.
    order_convention: Right ray from k; h is arbitrary and no division by h occurs.
    domain: Complete normed real E; explicit T05 witness and weighted tail premises.
    nonempty_witness: h = 0 is included whenever both explicit tail premises hold.
    bound: not_applicable; no L, positivity, or estimate is present.
    derivative_convention: The private proof differentiates only the scalar exponential, never F.
    branch_convention: not_applicable
    exceptional_values: The exceptional set is exactly the input S; no regular-point enlargement.
    normalization: Exact value h • integral over Ioi k; T05 supplies F k = 0.
  - target_id: IMP-001-T07
    module: LMLF.Integral.Improper.Bochner
    declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.of_integrableOn_Ioi
    theorem_class: qualitative_support
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: Routine bridge from honest absolute Bochner integrability.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t07
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.HasImproperIntegralAtTopExcept.of_integrableOn_Ioi
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] (f : ℝ → E) (k : ℝ) (S : Finset ℝ)
          (hS : ∀ c ∈ S, k < c)
          (hf : MeasureTheory.IntegrableOn f (Set.Ioi k)) :
          LMLF.Integral.HasImproperIntegralAtTopExcept
            f k S (∫ t in Set.Ioi k, f t)
    mathematical_statement: >-
      IntegrableOn f (Ioi k), together with every c in arbitrary finite S
      lying above k, gives the relation at the honest Bochner set integral.
    order_convention: Arbitrary finite marking set S; no canonical enlargement is selected.
    domain: Complete normed real E and explicit IntegrableOn f (Ioi k).
    nonempty_witness: The zero integrand works for every finite S above k.
    bound: not_applicable
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: The value at the single point k is null-set irrelevant.
    normalization: The conclusion value is exactly the Ioi set integral.
  - target_id: IMP-001-T08
    module: LMLF.Integral.Improper.Basic
    declaration: LMLF.Integral.hasImproperIntegralAtTopExcept_iff_exists_primitive
    theorem_class: exact_identity
    coverage_class: reusable_infrastructure
    novelty_class: non_novel
    relationship_to_source: >-
      Exact equivalence between independent endpoint-component semantics and
      existence of a convergent normalized primitive.
    theorem_card_id: TC-IMP-001-R7
    natural_language_proof_id: NLP-IMP-001-R7
    proof_section: target-imp-001-t08
    proof_context_id: IMP-001-R7-FULL-CONTEXT
    exact_lean_signature: |
      theorem LMLF.Integral.hasImproperIntegralAtTopExcept_iff_exists_primitive
          {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          [CompleteSpace E] {f : ℝ → E} {k : ℝ} {S : Finset ℝ}
          {I : E} :
          LMLF.Integral.HasImproperIntegralAtTopExcept f k S I ↔
            ∃ F : ℝ → E,
              LMLF.Integral.IsFiniteExceptionalPrimitive f k S F ∧
                Filter.Tendsto F Filter.atTop (nhds I)
    mathematical_statement: >-
      T01 at I holds if and only if there exists F satisfying exactly T05 and
      tending to I atTop.
    order_convention: Canonical component stitching is owned only by T08.
    domain: Exact T01 and T05 domains for the same f, k, S, and I.
    nonempty_witness: The zero relation has the zero primitive witness.
    bound: >-
      No quantitative norm bound or bounding constant is included in the
      signature; existential boundedness is derived separately from continuity
      and the finite atTop limit.
    derivative_convention: not_applicable
    branch_convention: not_applicable
    exceptional_values: Witness values below k are unconstrained and conclusion-invariant.
    normalization: The right side is existential in F, never fixed at an arbitrary supplied F.

