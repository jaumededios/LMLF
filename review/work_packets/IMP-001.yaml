    source_occurrences: []
  original_statement_or_formula: |
    Define an ordinary right-ray improper-integral relation with a finite set
    of independent exceptional endpoints and honest regular-piece Bochner
    integrability. Define its normalized continuous finite-exceptional
    primitive semantics. Prove their existential equivalence, uniqueness,
    heterogeneous finite CLM combination on the literal union, exact regular
    prepending, an arbitrary-marking bridge from IntegrableOn on Ioi, and the
    same-exception-set exponential Abel composition at its exact weighted
    primitive integral. The finite-piece Abel identity remains private.

