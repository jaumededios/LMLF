schema_version: 3
record_kind: review_envelope
storage_requirement: external_to_candidate_head
work_item_id: REPLACE_WITH_STABLE_ID

specification_binding:
  spec_commit: REPLACE_WITH_FULL_COMMIT_SHA
  work_packet_path: REPLACE_WITH_SPECIFICATION_PATH
  work_packet_sha256: REPLACE_WITH_ORDINARY_SHA256
  theorem_cards:
    - artifact_id: TC_REPLACE
      revision: REPLACE_WITH_IMMUTABLE_REVISION
      sha256: REPLACE_WITH_SHA256
  natural_language_proofs:
    - artifact_id: NLP_REPLACE
      revision: REPLACE_WITH_IMMUTABLE_REVISION
      sha256: REPLACE_WITH_SHA256
  classification_schema:
    path: review/classifications-v3.json
    schema_version: lmlf-classification-v3
    artifact_revision: 3
    sha256: 975e08b89d609cbdd15ff3f8d24f40a42bb17ea0f4c37bb26d9cf53fb8dc4b5e

toolchain_binding:
  lean_toolchain: REPLACE_WITH_EXACT_TOOLCHAIN
  mathlib_revision: REPLACE_WITH_RESOLVED_FULL_COMMIT_SHA

candidate_binding:
  base_sha: null
  head_sha: null
  proposer_evidence_ref: null

pre_lean_gates:
  overall_distinct_reviewer_ids: []
  theorem_card_review:
    gate_state: pending # pending | pass | fail | blocked
    distinct_reviewer_ids: []
    selected_reviewer_composition: null
    verdict_refs: []
  natural_language_proof_review:
    applicability: required # required | not_applicable
    inapplicable_reason: null
    gate_state: pending # pending | pass | fail | blocked | not_required
    distinct_reviewer_ids: []
    selected_reviewer_composition: null
    verdict_refs: []
  structural_circularity_review:
    applicability: required # required | not_applicable
    inapplicable_reason: null
    gate_state: pending # pending | pass | fail | blocked | not_required
    distinct_reviewer_ids: []
    selected_reviewer_composition: null
    represented_perspectives: []
    verdict_refs: []
  lean_ready:
    gate_state: pending
    decided_by: null
    evidence_refs: []
    requires_gate_states:
      theorem_card_review: pass
      natural_language_proof_review: REPLACE_WITH_PASS_OR_VALID_NOT_REQUIRED_FROM_PACKET
      structural_circularity_review: REPLACE_WITH_PASS_OR_VALID_NOT_REQUIRED_FROM_PACKET

implementation_reviews:
  gate_state: pending
  overall_distinct_reviewer_ids: []
  rubric_verdict_refs: []

disposition_ledger_ref: null
merge_gate_state: pending
merge_decision_ref: null
