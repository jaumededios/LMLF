scope:
  summary: >-
    From exactly the collated hypotheses of Olver 1997 Theorem 3.1, derive for
    every fixed truncation order an explicit local-Gamma plus exponential-tail
    finite bound with visible witnesses. A later SR-001 audit theorem recovers
    the printed qualitative expansion.
  candidate_module: LMLF.Olver1997.Chapter3.Watson
  exact_signatures_artifact: pending after source and integral-semantics review
  candidate_public_targets:
    - target_id: OLV-001-T01
      declaration: LMLF.Olver1997.Chapter3.watson_finite
  included:
    - exact exponent and zero-based order convention from Theorem 3.1
    - existential local and tail witnesses derived from source hypotheses
    - finite quantitative remainder inequality
    - proof route to the printed qualitative expansion
  excluded:
    - section 9.1 global-majorant bounds
    - best-supremum formulas for sigma_n
    - named-function applications
    - uniformity in order or external parameters
    - Lean implementation before external authorization

source_contract:
  location: Chapter 3 section 3.2, Theorem 3.1, printed pages 71-72
  amplitude_expansion: >-
    q(t) and a_s are complex-valued, with a real specialization, at powers
    (s+lambda-mu)/mu as t tends to zero from the positive side, in Olver's
    fixed-order asymptotic-expansion sense.
  parameter_domain: lambda > 0 and mu > 0
  convergence: >-
    The improper Laplace integral over the full positive range converges for
    all sufficiently large positive x.
  source_conclusion: >-
    The Laplace integral has coefficients Gamma((s+lambda)/mu)*a_s at powers
    x^(-(s+lambda)/mu) as x tends to positive infinity.
  source_regularities: >-
    Integrals are ordinary Riemann improper integrals. A finite exceptional set
    is split with independent one-sided convergence at every endpoint; no
    principal-value cancellation is part of this theorem. Proper compact
    integrals are available away from the exceptional set and are transported
    to Mathlib's Bochner intervalIntegral in the Lean-facing adapter.

quantitative_contract:
  beta_n: (n + lambda) / mu
  witnesses: one common X > 0; for each n, k_n > 0, K_n > 0, L_n >= 0
  domain: x > X
  bound: >-
    norm(integral - sum_{s<n} a_s*Gamma(beta_s)*x^(-beta_s)) <=
    K_n*Gamma(beta_n)*x^(-beta_n) + L_n*exp(-(x-X)*k_n)
  order_convention: n retained terms indexed 0 through n-1; empty at n=0
  branch_convention: positive-real powers only
  derivative_convention: not_applicable
  exceptional_values: no Gamma poles because beta_s > 0
  scalar_boundary: >-
    The source-facing target is complex-valued with real parameter x and
    positive-real powers; a real-valued theorem is a specialization.
  primitive_boundary: >-
    For each n, the source adapter constructs a continuous normalized baseline
    primitive through the finite exceptional set, with its genuine integral
    increment law on regular pieces and a global norm bound.
  local_regularity: >-
    After k_n is placed below the finite exceptional set, the source's proper
    regularity on compact regular intervals supplies the measurability needed
    for the local dominated-integrability argument.

