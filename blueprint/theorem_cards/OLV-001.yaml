consumer_regressions:
  - >-
    Choose one baseline X > 0 and one canonical T01 value before n. For each
    s<n, separately prove IntegrableOn for the Gamma model, identify its exact
    set-integral value, and use public IMP T07 on the literal arbitrary S.
  - >-
    Use generalized public IMP T03 for the finite model subtraction, prove the
    local AEStronglyMeasurable fact under restricted volume and the resulting
    IntervalIntegrable proposition at zero, use public IMP T04 to move to k_n,
    and use public IMP T08 forward to extract the primitive and its finite
    limit. No pointwise StronglyMeasurable strengthening, private sorted
    representation, or finite-piece Abel lemma may appear.
  - >-
    Derive L_n from eventual boundedness plus boundedness on a compact prefix;
    reject any signature in which L_n is a field or conclusion hidden in T08.
  - >-
    Revision-4 QL T02 must return an explicit Q, the canonical ordinary-
    improper relation for Q, and the finite remainder bound. A totalized
    conditional Bochner set integral is not an acceptable substitute.
  - >-
    The future qualitative bridge chooses values for x>X from the n=0
    existence result, extends the function arbitrarily by zero outside that
    domain, and uses public IMP T02 uniqueness to transfer every n-bound to
    that one function.

