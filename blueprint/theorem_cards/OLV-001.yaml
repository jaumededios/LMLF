scope:
  summary: >-
    From exactly the collated hypotheses of Olver 1997 Theorem 3.1, derive for
    every fixed truncation order an explicit local-Gamma plus exponential-tail
    finite bound with visible witnesses and an explicit related
    ordinary-improper value. A later SR-001 audit theorem uses uniqueness to
    put every fixed-order estimate on one Laplace function and recovers the
    printed qualitative expansion.
  candidate_module: LMLF.Olver1997.Chapter3.Watson
  exact_signatures_artifact: absent pending IMP-001 revision 6 and QL-001 revision 4 acceptance plus fresh OLV-001 revision 4 review
  candidate_public_targets:
    - target_id: OLV-001-T01
      declaration: LMLF.Olver1997.Chapter3.watson_finite
  included:
    - exact exponent and zero-based order convention from Theorem 3.1
    - existential local and tail witnesses derived from source hypotheses
    - explicit relational Laplace values, never totalized conditional set integrals
    - public IMP T07 model construction, T03 subtraction, T04 splitting, and T08 primitive extraction
    - finite quantitative remainder inequality
    - one-function choice and uniqueness route to the printed qualitative expansion
  excluded:
    - section 9.1 global-majorant bounds
    - best-supremum formulas for sigma_n
    - named-function applications
    - uniformity in order or external parameters
    - source-adapter access to private sorted-break or finite-piece Abel helpers
    - Lean implementation before external authorization

source_contract:
  location: Chapter 3 section 3.2, Theorem 3.1, printed pages 71-72
  amplitude_expansion: >-
    q(t) and a_s are complex-valued, with a real specialization, at powers
    (s+lambda-mu)/mu as t tends to zero from the positive side, in Olver's
    fixed-order asymptotic-expansion sense.
  parameter_domain: lambda > 0 and mu > 0
  convergence: >-
    The improper Laplace integral over the full positive range converges for
    all sufficiently large positive x. On the Lean-facing side this is an
    existence statement for a value related by the canonical
    HasImproperIntegralAtTopExcept predicate, not a totalized set integral.
  source_conclusion: >-
    The Laplace integral has coefficients Gamma((s+lambda)/mu)*a_s at powers
    x^(-(s+lambda)/mu) as x tends to positive infinity.
  source_regularities: >-
    Integrals are ordinary Riemann improper integrals. A finite exceptional set
    is split with independent one-sided convergence at every endpoint; no
    principal-value cancellation is part of this theorem. Proper compact
    integrals are available away from the exceptional set and are transported
    to Mathlib's Bochner intervalIntegral in the Lean-facing adapter. That
    Riemann-to-Bochner agreement remains a separate formal source obligation;
    Revision 4 makes no new source claim or fresh source-reconciliation claim.
    Before encoding baseline convergence by T01, the adapter uses the fixed
    n=0 expansion q(t)=O(t^(beta_0-1)), beta_0>0, and proper Riemann
    regularity on compact [epsilon,k] pieces. A countable exhaustion supplies
    AE strong measurability under volume restricted to (0,k], and domination
    proves the honest local Bochner integrability at zero that T01 requires.
    Pointwise StronglyMeasurable is not claimed because null-set modifications
    are immaterial. This source conversion remains an explicit formal
    obligation, occurs before the later arbitrary n, and does not make the
    common baseline X order-dependent.

quantitative_contract:
  beta_n: (n + lambda) / mu
  witnesses: one common X > 0; for each n, k_n > 0, K_n > 0, L_n >= 0
  domain: x > X
  related_value_quantifiers: >-
    Choose X before n. After the order-dependent k_n, K_n, and L_n, every
    x > X has an explicit Q related to the weighted amplitude. Uniqueness
    identifies these values across all n.
  bound: >-
    For every x > X there exists Q related to the weighted amplitude by the
    canonical finite-exceptional ordinary-improper relation, and
    norm(Q - sum_{s<n} a_s*Gamma(beta_s)*x^(-beta_s)) <=
    K_n*Gamma(beta_n)*x^(-beta_n) + L_n*exp(-(x-X)*k_n).
  order_convention: n retained terms indexed 0 through n-1; empty at n=0
  branch_convention: positive-real powers only
  derivative_convention: not_applicable
  exceptional_values: no Gamma poles because beta_s > 0
  qualitative_value_choice: >-
    A future qualitative bridge chooses Q at each x > X from the n=0
    existence result, extends the resulting function by zero outside that
    domain, and uses uniqueness to transport every fixed-order bound. This
    logical choice computes neither the Laplace value nor any bound constant.
  scalar_boundary: >-
    The source-facing target is complex-valued with real parameter x and
    positive-real powers; a real-valued theorem is a specialization.
  primitive_boundary: >-
    For each n, the source adapter first constructs the baseline remainder
    relation through public finite linearity and splitting. Public IMP T08 then
    supplies a continuous normalized primitive with its genuine regular-piece
    increment law and the same finite limit. The source adapter derives a
    global norm bound from that limit and compact-prefix continuity; the bound
    is not a T08 field.
  local_regularity: >-
    After k_n is placed below the finite exceptional set, proper Riemann
    regularity on every [epsilon,k_n] and countable exhaustion supply
    AEStronglyMeasurable phi_n with respect to volume restricted to (0,k_n].
    This measure-relative fact, not pointwise StronglyMeasurable, is the
    measurability input to the local dominated-integrability argument.

