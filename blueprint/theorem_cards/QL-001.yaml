      declaration: LMLF.Integral.improperLaplace_localTail_bound
    - target_id: QL-001-T02
      declaration: LMLF.Integral.watsonFiniteRemainder_bound
  included:
    - conditional upper-tail convergence from a bounded baseline primitive
    - finite interior exceptional set with independent one-sided limits
    - honest Bochner integrability of the local interval at zero
    - an absolute-Bochner-to-ordinary-improper adapter for the Gamma model terms
    - local power-law Gamma majorant
    - finite model-moment decomposition
    - explicit relational values rather than totalized conditional set integrals
    - n = 0 behavior
  excluded:
    - derivation of local or tail constants from a named function
    - infinite-series integration
    - source-coverage or qualitative asymptotic declarations
    - section 9 best-exponent suprema
    - numerical automation

mathematical_contract:
  local_regularity: >-
    Generic QL takes phi AEStronglyMeasurable for volume restricted to (0,k]
    as a direct premise. For the complex-valued, hence finite-dimensional,
    Olver source adapter, a proper-Riemann hypothesis on every compact
    [epsilon,k] away from zero supplies exactly this a.e. premise by a
    countable exhaustion; no such implication is asserted for arbitrary
    Banach-valued Riemann integrability. Pointwise StronglyMeasurable/Borel
    regularity may fail after null-set modifications, and the pointwise power
    bound alone is not treated as an integrability theorem.
  local_bound: >-
    norm (phi t) <= K * t^(beta-1) on 0 < t <= k, with beta > 0,
    k > 0, and K >= 0.
  tail_bound: >-
    For a finite S contained in (k,infinity), F is continuous on [k,infinity),
    satisfies F(k)=0, has the baseline-integral increment law on every compact
    regular piece avoiding S, and has norm at most L for t >= k, with L >= 0.
  improper_semantics: >-
    Ordinary improper convergence is split at S, with independent one-sided
    endpoint limits and no principal-value cancellation. Every regular
    truncated piece uses Mathlib's Bochner intervalIntegral with explicit
    IntervalIntegrable evidence; the complex finite-dimensional source adapter
    proves agreement with Olver's proper Riemann pieces. T01 returns existence of an explicit related
    value and its bound. T02 returns an explicit value Q for the weighted
    amplitude, a relation witnessing that value, and the finite remainder
    bound. Displayed full-ray integrals are only shorthand for such related
    values and never denote a totalized conditional set integral.
  scalar_boundary: >-
    T01 is generic over a complete normed real vector space. T02 is complex
    scalar; a real specialization is a corollary. Powers and Gamma factors are
    positive-real objects.
  target_domain: x > max X 0
  conclusion: >-
    T01 produces a value I related to the full weighted remainder and proves
    norm I <= K*Gamma(beta)*x^(-beta) + L*exp(-(x-X)*k). T02 produces a value Q
    related to the full weighted amplitude and proves that the norm of Q minus
    the finite Gamma model is bounded by the corresponding T01 expression.
  order_convention: n retained terms indexed 0 through n-1; empty at n=0
  branch_convention: positive-real rpow only
  derivative_convention: not_applicable
  exceptional_values: x=X and x<=0 excluded; beta<=0 excluded

