consumer_regressions:
  - >-
    A source-shaped end-to-end regression begins with a baseline-X relation
    for weighted q and the raw finite Gamma model functions, not with a
    primitive assumed. It proves each baseline model IntegrableOn, applies T07
    and generalized T03 to obtain the baseline remainder relation, uses local
    integrability and T04 to move the start to k, applies T08 to obtain a
    normalized continuous primitive tending to the tail value, and derives a
    finite global bound L from convergence plus continuity before invoking QL.
  - >-
    An end-to-end T01 regression derives local IntervalIntegrable evidence at
    zero, derives weighted-primitive IntegrableOn and boundary vanishing from
    h=x-X>0 and the flat primitive bound, invokes public IMP T06 for arbitrary
    finite S, and invokes public IMP T04 to prepend [0,k].
  - >-
    An end-to-end T02 regression separately proves absolute integrability of
    every Gamma model by the pinned power-exponential theorem, invokes public
    IMP T07 to obtain its exact improper value, and invokes generalized public
    IMP T03 with the T01 remainder relation to construct Q. It may use public
    IMP T02 uniqueness to identify any other supplied value, and it neither
    unfolds T01 nor treats a totalized set integral as conditional convergence.
  - >-
    The n=0 regression has no model witnesses or coefficient access and reduces
    T02 to the T01 remainder relation for q.

