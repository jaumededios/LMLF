scope:
  summary: >-
    Prove a finite local-plus-tail estimate over a complete normed real vector
    space from supplied local constants and a finite-exceptional continuous
    primitive, then specialize to complex scalars and combine with finitely
    many Gamma moments to obtain a finite Watson remainder bound.
  candidate_module: LMLF.Integral.Watson
  exact_signatures_artifact: pending after integral-semantics review
  candidate_public_targets:
    - target_id: QL-001-T01
      declaration: LMLF.Integral.improperLaplace_localTail_bound
    - target_id: QL-001-T02
      declaration: LMLF.Integral.watsonFiniteRemainder_bound
  included:
    - conditional upper-tail convergence from a bounded baseline primitive
    - finite interior exceptional set with independent one-sided limits
    - a local-Bochner adapter that does not claim conditionally singular coverage
    - local power-law Gamma majorant
    - finite model-moment decomposition
    - n = 0 behavior
  excluded:
    - derivation of local or tail constants from a named function
    - infinite-series integration
    - source-coverage or qualitative asymptotic declarations
    - section 9 best-exponent suprema
    - numerical automation

mathematical_contract:
  local_regularity: >-
    phi is strongly measurable on (0,k], or arrives through an equivalent
    proper-Riemann adapter on every compact [epsilon,k] away from zero. The
    pointwise power bound alone is not treated as an integrability theorem.
  local_bound: >-
    norm (phi t) <= K * t^(beta-1) on 0 < t <= k, with beta > 0,
    k > 0, and K >= 0.
  tail_bound: >-
    For a finite S contained in (k,infinity), F is continuous on [k,infinity),
    satisfies F(k)=0, has the baseline-integral increment law on every compact
    regular piece avoiding S, and has norm at most L for t >= k, with L >= 0.
  improper_semantics: >-
    Ordinary improper convergence is split at S, with independent one-sided
    endpoint limits and no principal-value cancellation. Every regular
    truncated piece uses Mathlib's Bochner intervalIntegral with explicit
    IntervalIntegrable evidence; the source adapter proves agreement with
    Olver's proper Riemann pieces. The target returns existence and the bound.
  scalar_boundary: >-
    T01 is generic over a complete normed real vector space. T02 is complex
    scalar; a real specialization is a corollary. Powers and Gamma factors are
    positive-real objects.
  target_domain: x > max X 0
  conclusion: >-
    The norm of the full remainder integral is at most
    K*Gamma(beta)*x^(-beta) + L*exp(-(x-X)*k).
  order_convention: n retained terms indexed 0 through n-1; empty at n=0
  branch_convention: positive-real rpow only
  derivative_convention: not_applicable
  exceptional_values: x=X and x<=0 excluded; beta<=0 excluded

