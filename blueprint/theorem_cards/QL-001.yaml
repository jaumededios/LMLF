scope:
  summary: >-
    Prove a finite local-plus-tail estimate for a Laplace remainder with supplied
    local and bounded-primitive constants, then combine it with finitely many
    Gamma moments to obtain a finite Watson remainder bound.
  candidate_module: LMLF.Integral.Watson
  exact_signatures_artifact: pending after integral-semantics review
  candidate_public_targets:
    - target_id: QL-001-T01
      declaration: LMLF.Integral.improperLaplace_localTail_bound
    - target_id: QL-001-T02
      declaration: LMLF.Integral.watsonFiniteRemainder_bound
  included:
    - conditional upper-tail convergence from a bounded baseline primitive
    - local power-law Gamma majorant
    - finite model-moment decomposition
    - n = 0 behavior
  excluded:
    - derivation of local or tail constants from a named function
    - infinite-series integration
    - source-coverage or qualitative asymptotic declarations
    - section 9 best-exponent suprema
    - numerical automation

mathematical_contract:
  local_bound: >-
    norm (phi t) <= K * t^(beta-1) on 0 < t <= k, with beta > 0,
    k > 0, and K >= 0.
  tail_bound: >-
    The baseline primitive F(t)=integral_k^t exp(-X v) phi(v) dv has norm at
    most L for t >= k, with L >= 0.
  target_domain: x > max X 0
  conclusion: >-
    The norm of the full remainder integral is at most
    K*Gamma(beta)*x^(-beta) + L*exp(-(x-X)*k).
  order_convention: n retained terms indexed 0 through n-1; empty at n=0
  branch_convention: positive-real rpow only
  derivative_convention: not_applicable
  exceptional_values: x=X and x<=0 excluded; beta<=0 excluded

