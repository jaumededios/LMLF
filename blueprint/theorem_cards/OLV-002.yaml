scope:
  summary: >-
    From a supplied global exponential-power majorant for one fixed Watson
    remainder, derive the one-term Gamma bound at every
    x > max(sigma, 0).
  candidate_module: pending; no Lean module or signature is authorized
  exact_signatures_artifact: pending after scalar and integral-semantics review
  candidate_public_targets:
    - target_id: OLV-002-T01
      declaration: pending planning name
  included:
    - the supplied-majorant implication (9.01) to (9.02)
    - the exact strict domain x > max(sigma, 0)
    - the zero-coefficient and order-zero cases
    - a provisional complex-norm generalization with exact real recovery
  excluded:
    - construction or optimization of an admissible exponent
    - relaxed multiplicative majorants
    - sign-dependent refinements
    - derivation of the global majorant from Theorem 3.1
    - Lean declarations, signatures, prototypes, or implementation

source_contract:
  location: >-
    Chapter 3 section 9.1, printed page 89, PDF page 102, equations
    (9.01)-(9.02)
  fixed_order: n is a fixed natural truncation order
  beta_n: (n + lambda) / mu
  parameter_domain: lambda > 0 and mu > 0
  remainder: >-
    phi_n is the remainder defined in equation (3.04); the implication itself
    consumes only its supplied global majorant.
  supplied_majorant: >-
    norm(phi_n(t)) <= norm(a_n) * t^(beta_n-1) * exp(sigma_n*t)
    for every t > 0.
  source_domain: x > max(sigma_n, 0)
  source_conclusion: >-
    norm(integral over t>0 of exp(-x*t)*phi_n(t)) <=
    Gamma(beta_n)*norm(a_n)/(x-sigma_n)^beta_n.

mathematical_contract:
  scalar_codomain: >-
    Drafted uniformly for real or complex scalars; the real instance is the
    conservative source reading and the complex instance is explicitly a
    project generalization.
  measurability: >-
    phi_n has a strongly measurable representative on the positive reals;
    this makes explicit the integration regularity implicit in the source
    context.
  integral_semantics: >-
    Lebesgue/Bochner integral on the positive half-line after absolute
    integrability is established by domination.
  branch_convention: all powers have positive real base
  derivative_convention: not_applicable
  exceptional_values: >-
    beta_n is positive; x-sigma_n is positive; a_n=0 is permitted without any
    division or logarithm.
  constant_loss: none; the displayed Gamma majorant is retained exactly

