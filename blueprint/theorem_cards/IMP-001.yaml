hypothesis_laundering_check: >-
  The predicates expose every summand's exceptional set, their finite union,
  all regular-piece integrability, every one-sided endpoint limit, continuity,
  normalization, and increment law. They contain no boundedness constant,
  target Laplace value, convergence at a new weight, Gamma moment, Watson
  remainder, or source conclusion. T08 bundles no norm bound. T06 takes weighted-primitive integrability
  and boundary vanishing as separate propositions rather than fields of T05;
  QL derives both from its separately supplied positive weight and flat bound.
  The private finite-piece Fubini proof derives AEStronglyMeasurable only under
  its exact restricted product measure and adds no global StronglyMeasurable
  hypothesis.
choice_laundering_check: >-
  Sorting a finite set is canonical. Interior anchors are deterministic in the
  displayed semantics and are proved immaterial. The exceptional set in T03 is
  the explicit finite union of the supplied S_i, not a selected enlargement.
  Component and total values are unique. F is explicit input in T05/T06; T08
  asserts ordinary mathematical existence but defines neither a selected
  primitive nor an improper-integral value function by Classical.choose.

