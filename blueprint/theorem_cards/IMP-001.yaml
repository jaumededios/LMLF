scope:
  summary: >-
    Specify a relation for an ordinary improper integral on a right ray with a
    finite exceptional set, using independent one-sided limits of Mathlib
    Bochner intervalIntegral values; provide only the uniqueness, finite-union
    refinement/continuous-linear-combination, and regular-splitting laws required by the
    Watson route; specify a normalized continuous finite-exceptional primitive
    predicate; and prove the finite-piece exponential Abel identity by Bochner
    Fubini without assuming a derivative of the primitive.
  candidate_modules:
    - module: LMLF.Integral.Improper.Basic
      prospective_targets: IMP-001-T01 through IMP-001-T05
    - module: LMLF.Integral.Improper.Abel
      prospective_targets: IMP-001-T06
  module_split_status: prospective_only
  candidate_namespace: LMLF.Integral
  exact_signatures_artifact: pending after independent semantic and proof review
  signature_authorization: absent
  candidate_public_targets:
    - target_id: IMP-001-T01
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept
      signature_status: prospective_only
    - target_id: IMP-001-T02
