hypothesis_laundering_check: >-
  The predicates expose every summand's exceptional set, their finite union,
  all regular-piece integrability,
  every one-sided endpoint limit, continuity, normalization, and increment
  law. They contain no boundedness constant, target Laplace value, convergence
  at a new weight, Gamma moment, Watson remainder, or source conclusion.
choice_laundering_check: >-
  Sorting a finite set is canonical. Interior anchors are deterministic in the
  displayed semantics and are proved immaterial. The exceptional set in T03 is
  the explicit finite union of the supplied S_i, not a selected enlargement.
  Component and total values
  are unique. F is explicit input, not a choice-selected primitive. No
  improper-integral value function is defined by Classical.choose.

