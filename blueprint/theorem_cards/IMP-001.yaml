scope:
  summary: >-
    Specify a relation for an ordinary improper integral on a right ray with a
    finite exceptional set, using independent one-sided limits of Mathlib
    Bochner intervalIntegral values; specify its equivalent normalized
    finite-exceptional primitive semantics; provide the uniqueness, finite-union
    continuous-linear-combination, and regular-prepending laws required by the
    Watson route; bridge absolutely Bochner-integrable right rays to the
    relation for arbitrary finite exceptional sets; and provide a
    representation-independent exponential composition theorem. Its private
    proof uses the finite-piece Abel identity derived by Bochner Fubini without
    differentiating the primitive.
  modules:
    - module: LMLF.Integral.Improper.Basic
      targets: IMP-001-T01, IMP-001-T05, IMP-001-T08, IMP-001-T02, IMP-001-T03, IMP-001-T04
      imports:
        - Mathlib.Data.Finset.Sort
        - Mathlib.MeasureTheory.Integral.DominatedConvergence
    - module: LMLF.Integral.Improper.Bochner
      targets: IMP-001-T07
      imports:
        - LMLF.Integral.Improper.Basic
        - Mathlib.MeasureTheory.Integral.IntegralEqImproper
    - module: LMLF.Integral.Improper.Abel
      targets: IMP-001-T06
      imports:
        - LMLF.Integral.Improper.Basic
        - Mathlib.Analysis.SpecialFunctions.ExpDeriv
        - Mathlib.MeasureTheory.Integral.IntervalIntegral.FundThmCalculus
        - Mathlib.MeasureTheory.Integral.Prod
        - Mathlib.MeasureTheory.Integral.IntegralEqImproper
  module_split_status: frozen_for_external_review
  namespace: LMLF.Integral
  exact_signatures_artifact:
    path: blueprint/theorem_cards/IMP-001-signatures-R6.md
    semantic_revision: R6
    proposal_revision: 2
    sha256: 0e220214233fec5f2f95608789b139900e7dfddef8a6b824b8d54bce37e74f2d
    status: immutable_snapshot_bound_by_this_card_for_external_review
  public_targets:
    - target_id: IMP-001-T01
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept
      signature_status: frozen_exact
    - target_id: IMP-001-T02
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.unique
      signature_status: frozen_exact
    - target_id: IMP-001-T03
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.finset_clm
      signature_status: frozen_exact
    - target_id: IMP-001-T04
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.split_regular
      signature_status: frozen_exact
    - target_id: IMP-001-T05
      declaration: LMLF.Integral.IsFiniteExceptionalPrimitive
      signature_status: frozen_exact
    - target_id: IMP-001-T06
      declaration: LMLF.Integral.IsFiniteExceptionalPrimitive.hasImproperIntegralAtTopExcept_exp_smul
      signature_status: frozen_exact
    - target_id: IMP-001-T07
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.of_integrableOn_Ioi
      signature_status: frozen_exact
    - target_id: IMP-001-T08
      declaration: LMLF.Integral.hasImproperIntegralAtTopExcept_iff_exists_primitive
      signature_status: frozen_exact
  public_target_count: 8
  target_minimality: >-
    T01 and T05 are the two semantic predicates, and T08 is their public
    source-semantic equivalence with convergence of an explicit normalized
    primitive. T02 prevents ambiguity. T03 is the one heterogeneous-codomain
    finite linearity law needed for model subtraction, and T04 is the one
    regular-piece prepending law needed to join the local interval to a tail.
    T07 prevents every absolutely integrable model moment from reimplementing
    the relation representation. T06 is the representation-independent Abel
    composition consumed by QL; its finite-piece identity remains private.
    Sorted recursion, anchor APIs, and any optional insertion helper remain private. These eight
    targets are justified by the complete QL/OLV consumer route, not by an
    arbitrary target ceiling.
  included:
    - a right-ray relation with a finite set of exceptional points strictly above the initial point
    - independent left and right limits at every finite exceptional point
    - one-sided passage to positive infinity
    - explicit IntervalIntegrable evidence for every compact regular truncation
    - uniqueness, finite-set refinement, and finite functorial linearity under continuous real-linear maps
    - splitting or prepending one compact regular interval
    - a continuous normalized primitive predicate with regular-piece increment law
    - equivalence between the relation and existence of a convergent normalized finite-exceptional primitive
    - an arbitrary-exception-set bridge from absolute Bochner integrability on the open ray
    - a public finite-exception exponential composition theorem for every real exponential parameter when its explicit weighted-tail hypotheses hold
    - a private finite-piece exponential Abel/Fubini identity used to prove that composition theorem
    - empty exceptional set and degenerate finite interval behavior
  excluded:
    - a project-local proper Riemann integral
    - Cauchy principal value or any coupled left-right cutoff
    - whole-line, two-sided-infinity, contour, or oscillatory-specific APIs
    - a partial-value or choice-selected improper-integral function
    - a bundled quantitative certificate containing k, K, X, or L
    - bounded-primitive tail estimates, Gamma moments, and Watson remainders
    - a converse from the improper relation to absolute Bochner integrability
    - a norm bound bundled into the primitive equivalence
    - a public sorted-list representation, recursive constructor/eliminator, or implementation-specific anchor API
    - any public declaration, helper, constructor, or theorem beyond the exact eight frozen targets
    - any production import beyond the exact per-module surfaces above without a new reviewed card
    - numerical evaluators, interval certificates, floating-point tolerances, quadrature, or solvers

