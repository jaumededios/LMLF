scope:
  summary: >-
    Specify a relation for an ordinary improper integral on a right ray with a
    finite exceptional set, using independent one-sided limits of Mathlib
    Bochner intervalIntegral values; specify its equivalent normalized
    finite-exceptional primitive semantics; provide the uniqueness, finite-union
    continuous-linear-combination, and regular-prepending laws required by the
    Watson route; bridge absolutely Bochner-integrable right rays to the
    relation for arbitrary finite exceptional sets; and provide a
    representation-independent exponential composition theorem. Its private
    proof uses the finite-piece Abel identity derived by Bochner Fubini without
    differentiating the primitive.
  candidate_modules:
    - module: LMLF.Integral.Improper.Basic
      prospective_targets: IMP-001-T01, IMP-001-T02, IMP-001-T03, IMP-001-T04, IMP-001-T05, IMP-001-T08
    - module: LMLF.Integral.Improper.Bochner
      prospective_targets: IMP-001-T07
    - module: LMLF.Integral.Improper.Abel
      prospective_targets: IMP-001-T06
  prospective_module_dependencies:
    - module: LMLF.Integral.Improper.Basic
      imports: finite order, intervalIntegral basics, primitive continuity, topology of finite sums and Hausdorff limits
    - module: LMLF.Integral.Improper.Bochner
      imports: LMLF.Integral.Improper.Basic and Mathlib.MeasureTheory.Integral.IntegralEqImproper
    - module: LMLF.Integral.Improper.Abel
      imports: LMLF.Integral.Improper.Basic plus finite Fubini/product integration, interval FTC, real exponential derivative, and IntegralEqImproper
  module_split_status: prospective_only
  candidate_namespace: LMLF.Integral
