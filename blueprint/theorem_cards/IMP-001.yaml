scope:
  summary: >-
    Specify a relation for an ordinary improper integral on a right ray with a
    finite exceptional set, using independent one-sided limits of Mathlib
    Bochner intervalIntegral values; provide only the uniqueness, finite-union
    refinement/continuous-linear-combination, and regular-splitting laws required
    by the Watson route; specify a normalized continuous finite-exceptional
    primitive predicate; and provide a representation-independent exponential
    composition theorem that constructs the target improper relation from that
    predicate and explicit weighted-tail hypotheses. Its private proof uses the
    finite-piece Abel identity derived by Bochner Fubini without differentiating
    the primitive.
  candidate_modules:
    - module: LMLF.Integral.Improper.Basic
      prospective_targets: IMP-001-T01 through IMP-001-T05
    - module: LMLF.Integral.Improper.Abel
      prospective_targets: IMP-001-T06
  module_split_status: prospective_only
  candidate_namespace: LMLF.Integral
  exact_signatures_artifact: absent-deferred-until-two-fresh-r4-proof-and-architecture-approvals
  signature_design_timing: >-
    Exact Lean signatures and binder order may be designed only after two
    independent fresh reviewers approve the complete revision-4 proof and its
    public-API/dependency architecture, including the QL-shaped acceptance
    regression. The revision-3 signature artifact is superseded design evidence
    and is not an R4 signature input.
  signature_authorization: absent
  candidate_public_targets:
    - target_id: IMP-001-T01
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept
      signature_status: prospective_only
    - target_id: IMP-001-T02
      declaration: LMLF.Integral.HasImproperIntegralAtTopExcept.unique
      signature_status: prospective_only
    - target_id: IMP-001-T03
