    natural-language proof provisionally labeled NLP-IMP-001-REG and obtain at
    least two fresh independent reviews. No path, digest, authorization, or
    current dependency is asserted for that planned artifact.
  material_change_rule: >-
    If a regression proof reveals a required change to a target type,
    definition semantics, or mathematical contract, issue a new final
    specification revision and repeat the applicable pre-Lean review.

blocking_conditions:
  - fresh final review must accept this exact R7 card, frozen NLP-IMP-001-R7 with its unchanged R6 mathematical provenance, and the immutable R6-revision-2 signature proposal
  - the default pre-Lean quorum is three distinct reviewer IDs overall, including at least two card reviews, at least two natural-language-proof reviews, and structural coverage of all three required perspectives
  - prior proof, architecture, or signature-design reports are prerequisite historical context only and count zero toward the final R7 quorum
  - no external envelope currently records lean_ready or authorizes proof implementation
  - every IMP-R01 through IMP-R25 and every edge-test obligation remains required before implementation acceptance; the signature harness supplies only partial evidence
  - the planned NLP-IMP-001-REG companion and its fresh review are required before formalizing the identified new analytic example or counterexample mathematics

