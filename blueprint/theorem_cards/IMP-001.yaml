mathematical_contract:
  ambient_space: >-
    E and, for T03, H are complete normed real vector spaces. All finite
    integrals are Bochner intervalIntegrals with respect to real Lebesgue
    volume. T03 has common input/value space E and output space H.
  relation_inputs: >-
    A function f : Real -> E, an initial point k : Real, a finite set S of
    real exceptional points satisfying k < c for every c in S, and a proposed
    value I : E.
  relation_semantics: >-
    Order S increasingly. Split [k,infinity) at those points. On each open
    component require IntervalIntegrable f on every compact subinterval and
    require the two endpoint contributions separately: from k to the first
    exception, from the right of each exception and to the left of the next,
    and from the right of the last exception to infinity. The sum of the
    component values must be I. If S is empty, this is the one-sided limit of
    intervalIntegral f k R as R tends to infinity. No limit may couple the two
    sides of an exceptional point.
  anchor_convention: >-
    The mathematical semantics is independent of the auxiliary interior
    anchor used to split an open component. The proof dossier uses the midpoint
    of a bounded component and c+1 for the final unbounded component only to
    display a deterministic witness. Exact Lean encoding is deferred.
  endpoint_convention: >-
    k is regular and is not in S. Values of f at isolated exceptional points
    are irrelevant to the finite interval integrals, but behavior approaching
    each side is not ignored. At k the contract requires honest local Bochner
    integrability: an absolutely integrable singularity is allowed because the
    value at k is null-set irrelevant, while a merely conditionally improper
    non-L1 singularity at k is rejected.
  primitive_contract: >-
    IsFiniteExceptionalPrimitive g k S F means S is above k, F is continuous
    on [k,infinity), F(k)=0, and for every k <= a <= b whose closed interval
    avoids S, g is IntervalIntegrable on [a,b] and
    F(b)-F(a)=intervalIntegral g a b.
  primitive_equivalence_contract: >-
    HasImproperIntegralAtTopExcept f k S I holds if and only if there exists
    F with IsFiniteExceptionalPrimitive f k S F and Tendsto F atTop (nhds I).
    The existential is essential: the theorem does not claim an equivalence
    for an arbitrary preselected F. It contains no norm bound, fixes F only on
    [k,infinity), and permits arbitrary values below k.
  bochner_bridge_contract: >-
    If f is IntegrableOn (Ioi k) and every c in the arbitrary finite S lies
    above k, then f has the finite-exceptional improper value equal to its
    Bochner set integral over Ioi k. The bridge may mark regular points; it
    never infers IntegrableOn from a relational improper value and never uses a
    totalized integral without its IntegrableOn premise.
  finite_piece_abel_lemma: >-
    For a <= b, IntervalIntegrable g on [a,b], ContinuousOn F [a,b], and
    F(t)-F(a)=intervalIntegral g a t for every t in [a,b], every h : Real
    satisfies integral_a^b exp(-h*t) scalar-mul g(t) dt =
    exp(-h*b) scalar-mul F(b) - exp(-h*a) scalar-mul F(a) +
    h scalar-mul integral_a^b exp(-h*t) scalar-mul F(t) dt. This identity is
    an internal lemma, not a public target.
  finite_exception_composition_contract: >-
    If IsFiniteExceptionalPrimitive g k S F holds, the weighted primitive
    t |-> exp(-h*t) scalar-mul F(t) is integrable on (k,infinity), and its
    boundary value tends to zero at positive infinity, then the target
    integrand t |-> exp(-h*t) scalar-mul g(t) has the ordinary-improper value
    h scalar-mul integral over (k,infinity) of the weighted primitive, with the
    same arbitrary finite exceptional set S. The theorem is valid for every
    real h for which those two explicit tail hypotheses hold.
  derivative_convention: >-
    No derivative, almost-everywhere derivative, or absolute-continuity field
    for F is assumed. The private finite-piece lemma and public T06 composition
    theorem are proved from the increment law by finite Bochner Fubini and
    separate endpoint limits.
  orientation_convention: >-
    T01 and T06--T08 concern a right ray. T04 assumes a <= k. The private
    finite-piece Abel lemma assumes a <= b; reversed-orientation wrappers are
    deferred.
  totalization_warning: >-
    Convergence is never inferred from the value of a totalized nonintegrable
    Bochner integral. IntervalIntegrable evidence is part of every regular
    truncation, and the relation explicitly asserts every endpoint limit.
  exceptional_values: >-
    S empty is allowed. S containing a point at or below k is rejected. T06
    includes h=0 whenever its explicit weighted-tail hypotheses hold, and its
    private finite-piece lemma includes a=b. Principal-value-only singularities
    are rejected.

