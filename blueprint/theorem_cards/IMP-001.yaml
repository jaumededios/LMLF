      signature_status: prospective_only
    - target_id: IMP-001-T06
      declaration: LMLF.Integral.intervalIntegral_exp_smul_eq_of_integral_eq_sub
      signature_status: prospective_only
  public_target_count: 6
  target_minimality: >-
    T01 and T05 are the two semantic predicates. T02 prevents a relational
    value from being ambiguous. T03 refines every summand's exceptional set to
    their finite union and then applies one continuous-linear-map law; the
    Watson consumer thereby obtains finite sums, addition, negation, scalar
    multiplication, and regular-point insertion without separate public
    targets. T04 is the
    one regular-piece concatenation/splitting law needed to join a proper local
    piece to a conditionally improper tail. T06 is the only analytic identity.
  included:
    - a right-ray relation with a finite set of exceptional points strictly above the initial point
    - independent left and right limits at every finite exceptional point
    - one-sided passage to positive infinity
    - explicit IntervalIntegrable evidence for every compact regular truncation
    - uniqueness, finite-set refinement, and finite functorial linearity under continuous real-linear maps
    - splitting or prepending one compact regular interval
    - a continuous normalized primitive predicate with regular-piece increment law
    - the finite-piece exponential Abel identity for every real exponential parameter
    - empty exceptional set and degenerate finite interval behavior
  excluded:
    - a project-local proper Riemann integral
    - Cauchy principal value or any coupled left-right cutoff
    - whole-line, two-sided-infinity, contour, or oscillatory-specific APIs
    - a partial-value or choice-selected improper-integral function
    - a bundled quantitative certificate containing k, K, X, or L
    - bounded-primitive tail estimates, Gamma moments, and Watson remainders
    - a bridge to Mathlib set integrals under absolute integrability
    - exact Lean binder order, representation of sorted exceptional points, or imports frozen as an implementation contract

packet_local_concepts:
  items:
    - id: IMP-RAY-REL
      role: relational ordinary-improper value on a right ray with finite exceptional set
    - id: IMP-PRIMITIVE
      role: normalized continuous primitive on regular components
  note: >-
    These are project-local integration concepts and are not Olver source
