      signature_status: prospective_only
    - target_id: IMP-001-T06
      declaration: LMLF.Integral.IsFiniteExceptionalPrimitive.hasImproperIntegralAtTopExcept_exp_smul
      signature_status: prospective_only
  public_target_count: 6
  target_minimality: >-
    T01 and T05 are the two semantic predicates. T02 prevents a relational
    value from being ambiguous. T03 refines every summand's exceptional set to
    their finite union and then applies one continuous-linear-map law; the
    Watson consumer thereby obtains finite sums, addition, negation, scalar
    multiplication, and regular-point insertion without separate public
    targets. T04 is the
    one regular-piece concatenation/splitting law needed to join a proper local
    piece to a conditionally improper tail. Revision 4 replaces, rather than
    supplements, the revision-3 public finite-piece Abel target with T06, the
    finite-exception composition theorem that the first consumer actually
    needs. The finite-piece identity remains a private proof lemma in Abel.
    Exposing both would create a seventh public target with no second consumer;
    exposing sorted-recursion constructors would instead freeze a private
    representation. Six targets are therefore the minimal public surface that
    preserves the existing relation algebra and closes the QL construction gap.
  included:
    - a right-ray relation with a finite set of exceptional points strictly above the initial point
    - independent left and right limits at every finite exceptional point
    - one-sided passage to positive infinity
    - explicit IntervalIntegrable evidence for every compact regular truncation
    - uniqueness, finite-set refinement, and finite functorial linearity under continuous real-linear maps
    - splitting or prepending one compact regular interval
    - a continuous normalized primitive predicate with regular-piece increment law
    - a public finite-exception exponential composition theorem for every real exponential parameter when its explicit weighted-tail hypotheses hold
    - a private finite-piece exponential Abel/Fubini identity used to prove that composition theorem
    - empty exceptional set and degenerate finite interval behavior
  excluded:
    - a project-local proper Riemann integral
    - Cauchy principal value or any coupled left-right cutoff
    - whole-line, two-sided-infinity, contour, or oscillatory-specific APIs
    - a partial-value or choice-selected improper-integral function
    - a bundled quantitative certificate containing k, K, X, or L
    - bounded-primitive tail estimates, Gamma moments, and Watson remainders
    - a general T01-to-Mathlib whole-set bridge beyond the explicit weighted-primitive value used by T06
    - a public sorted-list representation, recursive constructor/eliminator, or implementation-specific anchor API
    - exact Lean binder order or imports frozen as an implementation contract

packet_local_concepts:
  items:
    - id: IMP-RAY-REL
      role: relational ordinary-improper value on a right ray with finite exceptional set
    - id: IMP-PRIMITIVE
      role: normalized continuous primitive on regular components
  note: >-
    These are project-local integration concepts and are not Olver source
    entities. Their existence earns no source-occurrence coverage.

mathematical_contract:
  ambient_space: >-
    E is a complete normed real vector space. All finite integrals are Bochner
    intervalIntegrals with respect to real Lebesgue volume.
  relation_inputs: >-
    A function f : Real -> E, an initial point k : Real, a finite set S of
    real exceptional points satisfying k < c for every c in S, and a proposed
    value I : E.
  relation_semantics: >-
    Order S increasingly. Split [k,infinity) at those points. On each open
    component require IntervalIntegrable f on every compact subinterval and
    require the two endpoint contributions separately: from k to the first
    exception, from the right of each exception and to the left of the next,
    and from the right of the last exception to infinity. The sum of the
    component values must be I. If S is empty, this is the one-sided limit of
    intervalIntegral f k R as R tends to infinity. No limit may couple the two
    sides of an exceptional point.
  anchor_convention: >-
    The mathematical semantics is independent of the auxiliary interior
    anchor used to split an open component. The proof dossier uses the midpoint
    of a bounded component and c+1 for the final unbounded component only to
    display a deterministic witness. Exact Lean encoding is deferred.
  endpoint_convention: >-
    k is regular and is not in S. Values of f at isolated exceptional points
    are irrelevant to the finite interval integrals, but behavior approaching
    each side is not ignored.
  primitive_contract: >-
    IsFiniteExceptionalPrimitive g k S F means S is above k, F is continuous
    on [k,infinity), F(k)=0, and for every k <= a <= b whose closed interval
    avoids S, g is IntervalIntegrable on [a,b] and
    F(b)-F(a)=intervalIntegral g a b.
  finite_piece_abel_lemma: >-
    For a <= b, IntervalIntegrable g on [a,b], ContinuousOn F [a,b], and
    F(t)-F(a)=intervalIntegral g a t for every t in [a,b], every h : Real
    satisfies integral_a^b exp(-h*t) scalar-mul g(t) dt =
    exp(-h*b) scalar-mul F(b) - exp(-h*a) scalar-mul F(a) +
    h scalar-mul integral_a^b exp(-h*t) scalar-mul F(t) dt. This identity is
    an internal lemma, not a seventh public target.
  finite_exception_composition_contract: >-
    If IsFiniteExceptionalPrimitive g k S F holds, the weighted primitive
    t |-> exp(-h*t) scalar-mul F(t) is integrable on (k,infinity), and its
    boundary value tends to zero at positive infinity, then the target
    integrand t |-> exp(-h*t) scalar-mul g(t) has the ordinary-improper value
    h scalar-mul integral over (k,infinity) of the weighted primitive, with the
    same arbitrary finite exceptional set S. The theorem is valid for every
    real h for which those two explicit tail hypotheses hold.
  derivative_convention: >-
    No derivative, almost-everywhere derivative, or absolute-continuity field
    for F is assumed. The private finite-piece lemma and public T06 composition
    theorem are proved from the increment law by finite Bochner Fubini and
    separate endpoint limits.
  orientation_convention: >-
    T01 and T06 concern a right ray. T04 assumes a <= k. The private
    finite-piece Abel lemma assumes a <= b; reversed-orientation wrappers are
    deferred.
  totalization_warning: >-
    Convergence is never inferred from the value of a totalized nonintegrable
    Bochner integral. IntervalIntegrable evidence is part of every regular
    truncation, and the relation explicitly asserts every endpoint limit.
  exceptional_values: >-
    S empty is allowed. S containing a point at or below k is rejected. T06
    includes h=0 whenever its explicit weighted-tail hypotheses hold, and its
    private finite-piece lemma includes a=b. Principal-value-only singularities
    are rejected.

