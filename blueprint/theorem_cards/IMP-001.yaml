edge_tests:
  - empty exceptional set reduces to an ordinary right-endpoint limit
  - T08 is checked for empty and multiple-point exceptional sets with all independent endpoints and the exact telescope
  - combining an amplitude exceptional on S with smooth model terms exceptional on the empty set concludes on S
  - T03 transports a common E-valued family through maps E to H, including real-to-complex and complex-to-real scalar transports
  - a one-over-distance singularity with symmetric principal value is rejected
  - a conditionally convergent one-sided singularity is accepted when both sides converge independently
  - a conditionally convergent tail such as sin(t)/t is not strengthened to absolute integrability
  - a nonintegrable truncation cannot pass through Mathlib integral totalization
  - an absolutely integrable square-root singularity at k is accepted while a merely conditionally improper non-L1 singularity at k is rejected
  - discontinuous componentwise primitives cannot telescope across an exceptional point
  - endpoint equality alone cannot replace the all-intermediate-point increment law
  - an exceptional finite prefix is a sum of split-improper component values, never one intervalIntegral
  - the Abel Fubini step proves Integrable uncurry K under the exact restricted product measure required by intervalIntegral_integral_swap
  - the Abel kernel is AEStronglyMeasurable under that restricted product measure without a global StronglyMeasurable hypothesis
  - the scalar exponential identity derives its derivative from Real.hasDerivAt_exp and never divides by h
  - >-
    the private finite-piece lemma handles a=b and h=0; public T06 handles
    h=0 under its explicit weighted-integrability and boundary-vanishing
    hypotheses and handles a continuous nondifferentiable primitive
  - >-
    a QL-shaped consumer with arbitrary finite S imports only public IMP
    modules, never unfolds HasImproperIntegralAtTopExcept or copies private
    recursion, derives weighted integrability and boundary vanishing from
    h>0 plus a separate flat bound, and constructs the target finite-exception
    relation through public T05 and T06
  - T07 accepts every finite marking set above k and cannot be invoked without IntegrableOn on Ioi k
  - T08 is existential in F, preserves independent endpoints, gives no norm bound, and is tested in both directions
  - values of f at k and S and values of a T08 witness F below k do not change any conclusion
  - T04 preserves the exact interval-integral sign and value order

