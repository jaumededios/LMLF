scope:
  summary: >-
    Reuse Complex.Gamma and expose a readable Euler-integral identification,
    convergence wrapper, real agreement, and mathlib's totalization convention
    at nonpositive integers.  No new Gamma function or analytic continuation is
    constructed.
  module: LMLF.Definitions.Gamma
  namespace: LMLF.Definitions
  imports:
    - Mathlib.Analysis.SpecialFunctions.Gamma.Basic
  public_declarations:
    - LMLF.Definitions.gamma_eulerIntegrable
    - LMLF.Definitions.gamma_eq_eulerIntegral
    - LMLF.Definitions.gamma_ofReal
    - LMLF.Definitions.gamma_neg_nat_eq_zero
  excluded:
    - a new Gamma definition
    - reciprocal Gamma
    - incomplete Gamma
    - reflection, duplication, Stirling, and asymptotic estimates
    - any claim that zero at a pole is a classical finite Gamma value

packet_local_concepts:
  items:
    - id: DEF-GAMMA-EULER-INTEGRAND
      role: readable notation for the displayed Euler integrand
  note: >-
    This packet-local label is not an Olver source-entity row.  A later closed
    source manifest links source entities explicitly.

reused_object:
  declaration: Complex.Gamma
  pinned_import: Mathlib.Analysis.SpecialFunctions.Gamma.Basic
  existing_facts:
    - Complex.GammaIntegral_convergent
    - Complex.Gamma_eq_integral
    - Complex.Gamma_ofReal
    - Complex.Gamma_neg_nat_eq_zero

public_signatures:
  gamma_eulerIntegrable: |-
    theorem gamma_eulerIntegrable {s : ℂ} (hs : 0 < s.re) :
        MeasureTheory.IntegrableOn
          (fun t : ℝ => (Real.exp (-t) : ℂ) * (t : ℂ) ^ (s - 1))
          (Set.Ioi 0)
  gamma_eq_eulerIntegral: |-
    theorem gamma_eq_eulerIntegral {s : ℂ} (hs : 0 < s.re) :
        Complex.Gamma s =
          ∫ t in Set.Ioi (0 : ℝ),
            (Real.exp (-t) : ℂ) * (t : ℂ) ^ (s - 1)
  gamma_ofReal: |-
    theorem gamma_ofReal (s : ℝ) :
        Complex.Gamma (s : ℂ) = (Real.Gamma s : ℂ)
  gamma_neg_nat_eq_zero: |-
    theorem gamma_neg_nat_eq_zero (n : ℕ) :
        Complex.Gamma (-(n : ℂ)) = 0

mathematical_contract:
  validity_domain: The Euler integral declarations require real part of s > 0.
  normalization: >-
    The reused object has Complex.Gamma 1 = 1 and Gamma(s+1) = s*Gamma(s) away
    from s = 0; these are audit checks, not additional public declarations in
    this packet.
  branch_convention: >-
    The positive real integration variable uses mathlib's complex power on its
    standard slit-plane convention; t > 0 avoids the cut and zero.
  derivative_convention: not_applicable
  exceptional_values: >-
    Complex.Gamma is totalized to zero at 0 and negative natural numbers.  The
    card documents that these inputs are classical poles, not finite values.
  real_agreement: Complex.Gamma_ofReal for every real input.

hypothesis_laundering_check: >-
