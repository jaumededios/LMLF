scope:
  summary: >-
    Reuse Complex.Gamma and expose a readable Euler-integral identification,
    convergence wrapper, real agreement, and mathlib's totalization convention
    at nonpositive integers.  No new Gamma function or analytic continuation is
    constructed.
  module: LMLF.Definitions.Gamma
  namespace: LMLF.Definitions
  imports:
    - Mathlib.Analysis.SpecialFunctions.Gamma.Basic
  public_declarations:
    - LMLF.Definitions.gamma_eulerIntegrable
    - LMLF.Definitions.gamma_eq_eulerIntegral
    - LMLF.Definitions.gamma_ofReal
    - LMLF.Definitions.gamma_neg_nat_eq_zero
  excluded:
    - a new Gamma definition
    - reciprocal Gamma
    - incomplete Gamma
    - reflection, duplication, Stirling, and asymptotic estimates
    - any claim that zero at a pole is a classical finite Gamma value

