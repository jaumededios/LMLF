scope:
  summary: >-
    Identify Olver's complex analytic coefficients with canonical casts of
    root bernoulli, identify the canonical rational polynomial from (1.09)
    with Polynomial.bernoulli, and then identify the real evaluation facade
    bernoulliFun. Coefficient-wise complex polynomial base change is only an
    algebraic corollary, not a source-scope claim. Use the printed rational
    recurrence for the source-to-pin bridge; audit coefficient orientation,
    B_0, B_1, zero evaluation, derivative/reflection conventions, and the
    denominator-cleared formal generating functions. Add no declaration or
    alias.
  candidate_module: null
  exact_signatures_artifact: not_applicable-no-project-declarations
  project_public_declarations: []
  reused_entities:
    - source_entity: bernoulli_numbers
      declaration: _root_.bernoulli
      type_shape: "Nat -> Rat"
      source_scalar_bridge: "Olver coefficient B_s^O = (bernoulli s : Complex)"
    - source_entity: bernoulli_polynomials
      declaration: Polynomial.bernoulli
      type_shape: "Nat -> Polynomial Rat"
      source_scalar_bridge: >-
        Exact canonical rational polynomial from (1.09); coefficient-wise map
        into Polynomial Complex is an algebraic corollary only.
    - source_entity: bernoulli_polynomials
      declaration: _root_.bernoulliFun
      type_shape: "Nat -> Real -> Real"
      role: real base-change and evaluation facade, not a separate source entity
  included:
    - coefficient orientation B_s(x) = sum_j choose(s,j) B_(s-j) x^j
    - negative-B_1 convention and B_1(x) = x - 1/2
    - B_s(0) = B_s over the rational polynomial and real facade
    - derivative with respect to the polynomial or real argument
    - reflection B_s(1-x) = (-1)^s B_s(x)
    - formal denominator-cleared generating identities
  excluded:
    - any duplicate Bernoulli definition, wrapper, notation, or compatibility alias
    - periodizedBernoulli, fractional-part periodization, and Olver's omega_s
    - all periodic endpoint choices, assigned integer values, and jump analysis
    - every Euler-Maclaurin identity, coefficient, remainder, and bound
    - analytic convergence of the complex generating series on abs(z) < 2*pi
    - midpoint identities, polynomial bounds, power sums, and zeta values

mathematical_contract:
  index_convention: s is a natural-number degree/index and precedes the argument.
  coefficient_orientation: >-
    The coefficient of x^j in B_s(x) is choose(s,j) * B_(s-j) for
    0 <= j <= s, and is zero above degree s.
  number_normalization: "B_0 = 1 and B_1 = -1/2."
  source_to_pin_bridge: >-
    Olver's printed recurrence (1.11), starting from B_0=1, keeps every source
    coefficient in the canonical copy of Rat inside Complex and uniquely
    determines it. Coefficient comparison in the pinned denominator-cleared
    formal identity instantiated at A = Rat gives the same recurrence for root
    bernoulli.
  evaluation_at_zero: "Polynomial.bernoulli s evaluated at zero is root bernoulli s."
  real_agreement: >-
    bernoulliFun s x is Polynomial.bernoulli s after mapping rational
    coefficients to real numbers and evaluating at x.
  derivative_convention: >-
    Differentiation is in x: the source states derivative(B_s) =
    s * B_(s-1) for s >= 1. Mathlib's s = 0 case is a harmless zero-factor
    algebraic extension and is not attributed to the source.
  reflection_convention: "B_s(1-x) = (-1)^s * B_s(x)."
  formal_number_generating_function: >-
    The power series with coefficient B_s/s! satisfies
    B(Z) * (exp(Z)-1) = Z.
  formal_polynomial_generating_function: >-
    The power series with coefficient B_s(x)/s! satisfies
    B_x(Z) * (exp(Z)-1) = Z * exp(x*Z), represented in Mathlib by rescaling
    the exponential power series.
  formal_quotient_warning: >-
    exp(Z)-1 has zero constant coefficient and is not inverted in the formal
    power-series ring; the two cleared product identities are normative.
  validity_domain: >-
    All s in Nat; Polynomial.bernoulli has rational coefficients;
    bernoulliFun evaluates its rational-coefficient base change on all real x.
  branch_convention: not_applicable
  exceptional_values: >-
    There are no poles or branches. At s = 1 the nonperiodic polynomial has
    B_1(0) = -1/2 and B_1(1) = 1/2; this is not a periodic endpoint policy.

