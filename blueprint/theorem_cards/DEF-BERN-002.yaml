scope:
  summary: >-
    Identify Olver's unscaled periodic function x |-> B_s({x}) = s! *
    omega_s(x) with the pullback x |-> periodizedBernoulli s
    (x : UnitAddCircle). Reuse the pinned circle-valued definition exactly,
    prove the half-open [0,1) representative and the B_1 integer point value
    in the dossier, and add no LMLF declaration, alias, notation, wrapper, or
    real-line facade.
  candidate_module: null
  exact_signatures_artifact: not_applicable-no-project-declarations
  project_public_declarations: []
  reused_entities:
    - source_entity: periodic_bernoulli_functions
      source_expression: "x |-> B_s({x}) = s! * omega_s(x)"
      declaration: _root_.periodizedBernoulli
      type_shape: "Nat -> UnitAddCircle -> Real"
      source_to_pin_bridge: >-
        For every s : Nat and x : Real, periodizedBernoulli s
        (x : UnitAddCircle) = bernoulliFun s (Int.fract x).
  target_minimality: >-
    The only source-identification target is the existing circle-valued
    periodizedBernoulli declaration. The real pullback equality, endpoint
    checks, and continuity split are identification evidence and prospective
    regressions, not proposed public targets. BER-001 owns any later real-line
    wrapper and calculus or envelope theorems.
  included:
    - the unscaled periodic function B_s({x}) and its exact relation s! * omega_s(x)
    - the representative Int.fract x in the half-open interval [0,1)
    - agreement with bernoulliFun s on [0,1)
    - the assigned value B_1(0) = -1/2 at every integer
    - the B_1 right-value/left-limit jump and the continuity split at s = 1
    - all natural indices s, including s = 0, 1, and 2 regressions
  excluded:
    - every new project declaration, wrapper, alias, or notation
    - a new real-line facade for periodizedBernoulli
    - derivative, primitive, integral, mean-zero, periodicity, and envelope APIs
    - construction of omega_s by recursive primitives
    - every Euler-Maclaurin identity, coefficient, endpoint conversion, remainder, and bound
    - Fourier expansions, zeta values, midpoint identities, power sums, and numerical evaluation

mathematical_contract:
  index_convention: s is a natural-number degree/index and precedes every argument.
  source_scaling: >-
    The identified Mathlib object is Olver's unscaled B_s({x}), not omega_s
    itself. Equation (1.07) gives omega_s(x) = B_s({x}) / s!.
  circle_contract: >-
    UnitAddCircle is Real modulo integer multiples of 1. The source real
    periodic function is represented without loss by a function on this
    quotient, and its pullback is evaluated at (x : UnitAddCircle).
  representative_contract: >-
    AddCircle.liftIco 1 0 selects the unique representative in Ico 0 1.
    AddCircle.coe_equivIco_mk_apply reduces that representative to
    Int.fract x, which satisfies 0 <= Int.fract x < 1.
  endpoint_contract: >-
    The right-hand representative 0 is selected at every integer. Therefore
    periodizedBernoulli 1 (k : UnitAddCircle) = bernoulliFun 1 0 = -1/2,
    while the left limit through representatives y -> 1 is +1/2.
  continuity_contract: >-
    periodizedBernoulli s is continuous on UnitAddCircle for s != 1. The
    excluded index is genuine: periodizedBernoulli 1 is discontinuous at the
    circle class of every integer because its left pullback limit is +1/2
    while its value and right pullback limit are -1/2.
  validity_domain: >-
    All s in Nat and all x in Real for the pullback; equivalently all points
    of UnitAddCircle for the reused declaration.
  derivative_convention: >-
    No global derivative theorem is claimed. In particular, the first
    periodized Bernoulli function must not be differentiated through its jump.
  branch_convention: not_applicable
  exceptional_values: >-
    There are no poles or branches. The only exceptional regularity index is
    s = 1; its assigned integer value is part of the source normalization.

prospective_audit_targets:
  - id: PBER-M00
    declaration: _root_.periodizedBernoulli
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "Nat -> UnitAddCircle -> Real"
  - id: PBER-M01
    declaration: _root_.bernoulliFun
    import: Mathlib.NumberTheory.ZetaValues
    expected_role: real evaluation of the accepted Bernoulli polynomial
  - id: PBER-M02
    declaration: AddCircle.liftIco
    import: Mathlib.Topology.Instances.AddCircle.Defs
    expected_role: half-open representative lift used by the pinned definition
  - id: PBER-M03
    declaration: AddCircle.liftIco_zero_coe_apply
    import: Mathlib.Topology.Instances.AddCircle.Defs
    expected_shape: "x in Ico 0 p -> liftIco p 0 f (x : AddCircle p) = f x"
  - id: PBER-M04
    declaration: AddCircle.coe_equivIco_mk_apply
    import: Mathlib.Topology.Instances.AddCircle.Defs
    expected_role: representative of a quotient point via Int.fract
  - id: PBER-M05
    declaration: Int.fract_nonneg
    import: Mathlib.Algebra.Order.Floor.Ring
    expected_shape: "0 <= Int.fract x"
  - id: PBER-M06
    declaration: Int.fract_lt_one
    import: Mathlib.Algebra.Order.Floor.Ring
    expected_shape: "Int.fract x < 1"
  - id: PBER-M07
    declaration: Int.fract_intCast
    import: Mathlib.Algebra.Order.Floor.Ring
    expected_shape: "Int.fract (k : Real) = 0"
  - id: PBER-M08
    declaration: _root_.bernoulliFun_one
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "bernoulliFun 1 x = x - 1 / 2"
  - id: PBER-M09
    declaration: _root_.bernoulliFun_eval_zero
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "bernoulliFun s 0 = (bernoulli s : Real)"
  - id: PBER-M10
    declaration: _root_.bernoulli_one
    import: Mathlib.NumberTheory.Bernoulli
    expected_shape: "bernoulli 1 = -1 / 2"
  - id: PBER-M11
    declaration: _root_.bernoulliFun_endpoints_eq_of_ne_one
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "s != 1 -> bernoulliFun s 1 = bernoulliFun s 0"
  - id: PBER-M12
    declaration: _root_.periodizedBernoulli.continuous
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "s != 1 -> Continuous (periodizedBernoulli s)"
  - id: PBER-M13
    declaration: _root_.bernoulliFun_zero
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "bernoulliFun 0 x = 1"
  - id: PBER-M14
    declaration: _root_.bernoulliFun_two
    import: Mathlib.NumberTheory.ZetaValues
    expected_shape: "bernoulliFun 2 x = x^2 - x + 1/6"
  - id: PBER-M15
    declaration: AddCircle.continuous_mk'
    import: Mathlib.Topology.Instances.AddCircle.Defs
    expected_role: continuity of the quotient map used by the discontinuity regression

