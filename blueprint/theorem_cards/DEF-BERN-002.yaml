edge_tests:
  - s = 0 gives the constant periodized function 1
  - s = 1 at every integer is -1/2, not +1/2 or 0
  - the left limit at an integer for s = 1 is +1/2 while the value and right limit are -1/2
  - s = 2 has matching endpoint values and a continuous circle function
  - negative real inputs use the usual Int.fract value in [0,1), not truncation toward zero
  - replacing liftIco by liftIoc changes the assigned B_1 endpoint and must fail
  - forgetting the factorial identifies omega_s rather than B_s({x}) and must fail for s >= 2
  - asserting continuity for all s must fail at s = 1

